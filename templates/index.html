<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Transformação KAZ</title>
<style>
:root{--bg:#f5f7fa;--card:#fff;--line:#e7ebf0;--text:#152235;--muted:#6c7a89;--nav:#0f1d2d;--blue:#2563eb;--green:#12805c;--amber:#b7791f;--red:#c2414b;--shadow:0 6px 24px rgba(15,29,45,.06)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}.app{display:grid;grid-template-columns:228px 1fr;min-height:100vh}.side{background:#fff;border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh}.brand{font-size:22px;font-weight:900;letter-spacing:-.5px;margin:3px 10px 26px}.brand small{display:block;font-size:10px;letter-spacing:.16em;color:#8793a1;margin-top:2px}.nav-btn{display:flex;width:100%;gap:10px;align-items:center;border:0;background:transparent;color:#556475;padding:10px 12px;border-radius:9px;cursor:pointer;margin:3px 0;text-align:left;font-size:13px}.nav-btn:hover,.nav-btn.active{background:#edf4ff;color:#173b6d;font-weight:700}.main{min-width:0}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 26px;position:sticky;top:0;z-index:20}.top-title{font-weight:800}.userbox{display:flex;gap:10px;align-items:center}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#26384b;color:#fff;font-size:12px;font-weight:800}.userbox small{display:block;color:var(--muted);font-size:10px}.content{padding:26px;max-width:1400px;margin:auto}.hero{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px}.hero h1{margin:0;font-size:27px;letter-spacing:-.7px}.hero p{margin:5px 0 0;color:var(--muted);font-size:13px}.grid-kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}.kpi{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:17px;box-shadow:var(--shadow)}.kpi strong{font-size:25px;display:block}.kpi span{font-size:11px;color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow)}.card-h{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.card-h h3{margin:0;font-size:14px}.pad{padding:16px}.project-table,.dep-table{width:100%;border-collapse:collapse;font-size:12px}.project-table th,.dep-table th{text-align:left;color:#7a8794;font-size:10px;text-transform:uppercase;letter-spacing:.04em;padding:10px 12px;border-bottom:1px solid var(--line)}.project-table td,.dep-table td{padding:12px;border-bottom:1px solid #eef1f4;vertical-align:middle}.project-table tr:last-child td,.dep-table tr:last-child td{border-bottom:0}.clickable{cursor:pointer}.clickable:hover{background:#f8fafc}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:700}.s-nao{background:#eef1f4;color:#53606d}.s-and{background:#daf5ea;color:#126f54}.s-risco{background:#fee2e2;color:#a9343e}.s-conc{background:#dbeafe;color:#1e5aac}.s-aberta{background:#fee2e2;color:#a9343e}.s-analise{background:#e0ecff;color:#2357a7}.s-resp{background:#daf5ea;color:#126f54}.s-resolvida{background:#e9edf2;color:#51606f}.btn{border:0;background:#17283b;color:#fff;padding:9px 13px;border-radius:9px;cursor:pointer;font-weight:700;font-size:12px}.btn.light{background:#eef2f6;color:#24384d}.btn.blue{background:var(--blue)}.btn.red{background:#fee2e2;color:#a9343e}.btn.green{background:#dcfce7;color:#136c51}.btn.small{padding:6px 9px;font-size:10px}.muted{color:var(--muted)}.two{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}.owner-project{display:flex;justify-content:space-between;align-items:center;padding:20px}.owner-project h2{margin:3px 0 0;font-size:24px}.owner-project .count{text-align:right;font-size:16px;font-weight:800}.owner-project .count strong{display:block;font-size:29px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:23px 0 10px}.section-title h2{font-size:17px;margin:0}.detail-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:14px}.detail-head h1{margin:4px 0 7px}.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow:auto}.tab{border:0;background:transparent;padding:11px 13px;color:#647487;cursor:pointer;white-space:nowrap}.tab.active{color:#173b6d;font-weight:800;border-bottom:2px solid #1d4ed8}.panel-section{display:none}.panel-section.active{display:block}.objective{line-height:1.55;font-size:13px}.milestone{border-top:1px solid #eef1f4;padding:13px 0}.milestone:first-child{border-top:0}.m-row{display:grid;grid-template-columns:1fr 150px 130px auto;gap:10px;align-items:center}.m-name{font-weight:700;font-size:13px}.m-detail{margin-top:10px;padding:12px;background:#f8fafc;border-radius:10px}.m-detail textarea{width:100%;min-height:70px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:10px;color:#6b7886}.field input,.field select,.field textarea{border:1px solid #d6dde5;border-radius:8px;padding:9px;background:#fff}.modal-wrap{position:fixed;inset:0;background:rgba(11,21,33,.48);display:grid;place-items:center;padding:18px;z-index:100}.modal{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:14px;padding:20px;box-shadow:0 20px 70px rgba(0,0,0,.2)}.modal h2{margin:0 0 14px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.hidden{display:none!important}.timeline{padding-left:23px}.event{position:relative;padding:0 0 17px 16px;border-left:1px solid #d9e0e8}.event:before{content:"";position:absolute;left:-5px;top:4px;width:9px;height:9px;background:#2c6bb2;border-radius:50%}.event:last-child{border-left-color:transparent}.event small{color:#8a96a4}.message{padding:11px;border-radius:10px;background:#f6f8fb;margin:8px 0}.message.dir{background:#edf4ff}.message strong{font-size:11px}.message p{margin:5px 0 0;font-size:12px;line-height:1.45}.readonly{opacity:.75}.notice{padding:10px 12px;background:#fff7dc;border:1px solid #f4df9e;border-radius:9px;font-size:11px;color:#6d5a16}.empty{text-align:center;padding:30px;color:#7c8794;font-size:12px}.mobile-menu{display:none}.flex{display:flex;gap:8px;align-items:center}.right{margin-left:auto}.meeting-box{padding:15px;margin-bottom:12px}.meeting-box h3{font-size:14px;margin:0 0 8px}.meeting-box textarea{width:100%;min-height:100px;border:1px solid #d6dde5;border-radius:8px;padding:10px}.footer-note{font-size:10px;color:#9aa4af;text-align:center;padding:22px}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.mobile-menu{display:inline-flex}.content{padding:16px}.grid-kpi{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.m-row{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.project-table,.dep-table{display:block;overflow:auto}.hero{align-items:flex-start}.top{padding:0 14px}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="brand">KAZ<small>TRANSFORMAÇÃO</small></div>
  <button class="nav-btn active" data-nav="home" onclick="showView('home')">⌂ Início</button>
  <button class="nav-btn" data-nav="projects" onclick="showView('projects')">▣ Projetos</button>
  <button class="nav-btn" data-nav="myproject" id="myProjectNav" onclick="openMyProject()">◎ Meu projeto</button>
  <button class="nav-btn" data-nav="dependencies" onclick="showView('dependencies')">! Pendências</button>
  <button class="nav-btn directionOnly" data-nav="director" onclick="showView('director')">☷ Pendências (Diretoria)</button>
  <button class="nav-btn" data-nav="meeting" onclick="showView('meeting')">◫ Modo Reunião</button>
  <a class="nav-btn adminOnly" href="/admin/users" style="text-decoration:none">♙ Usuários</a>
  <a class="nav-btn" href="/logout" style="text-decoration:none;margin-top:16px">↪ Sair</a>
</aside>
<main class="main">
<header class="top">
  <button class="btn light mobile-menu">☰</button>
  <div class="top-title" id="topTitle">Transformação KAZ</div>
  <div class="userbox"><div class="avatar" id="avatar"></div><div><b id="userName"></b><small id="userRole"></small></div></div>
</header>
<div class="content">
<section id="homeView" class="view"></section>
<section id="projectsView" class="view hidden"></section>
<section id="projectView" class="view hidden"></section>
<section id="dependenciesView" class="view hidden"></section>
<section id="directorView" class="view hidden"></section>
<section id="meetingView" class="view hidden"></section>
</div>
<div class="footer-note">Transformação KAZ · Pessoas · Processos · Resultados</div>
</main>
</div>
<div id="modalRoot"></div>
<script>
const INITIAL_STATE={{ initial_state|tojson }};
const USER={{ user|tojson }};
const CSRF={{ csrf|tojson }};
const DIRECTORS={{ directors|tojson }};
let state=INITIAL_STATE; let currentProjectId=null; let currentTab='overview';
const isDirection=['admin','direction'].includes(USER.role);
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));
function initials(n){return (n||'').split(' ').slice(0,2).map(x=>x[0]).join('').toUpperCase()}
function fmtDate(s){if(!s)return '—';try{return new Date(s).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}catch{return s}}
function badge(status){const map={'Não iniciado':'s-nao','Em andamento':'s-and','Em risco':'s-risco','Concluído':'s-conc','Aberta':'s-aberta','Em análise':'s-analise','Respondida':'s-resp','Resolvida':'s-resolvida'};return `<span class="pill ${map[status]||'s-nao'}">${esc(status)}</span>`}
function project(id){return state.projects.find(p=>p.id===id)}
function dep(id){return state.dependencies.find(d=>String(d.id)===String(id))}
function canEdit(pid){return isDirection || USER.project_id===pid}
function counts(p){const out={total:p.milestones.length,done:0,and:0,risk:0};p.milestones.forEach(m=>{if(m.status==='Concluído')out.done++;if(m.status==='Em andamento')out.and++;if(m.status==='Em risco')out.risk++});return out}
async function api(url,method='GET',body=null){const opt={method,headers:{'X-CSRF-Token':CSRF}};if(body!==null){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(body)}const r=await fetch(url,opt);let j={};try{j=await r.json()}catch{}if(!r.ok)throw new Error(j.error||`Erro ${r.status}`);return j}
async function refresh(){const j=await api('/api/state');state=j.state;renderCurrent()}
function navActive(name){document.querySelectorAll('.nav-btn[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===name))}
function showView(name){document.querySelectorAll('.view').forEach(v=>v.classList.add('hidden'));const el=document.getElementById(name+'View');if(el)el.classList.remove('hidden');navActive(name);window.scrollTo({top:0,behavior:'smooth'});if(name==='home')renderHome();if(name==='projects')renderProjects();if(name==='dependencies')renderDependencies();if(name==='director')renderDirector();if(name==='meeting')renderMeeting();}
function renderCurrent(){const visible=[...document.querySelectorAll('.view')].find(v=>!v.classList.contains('hidden'));if(!visible)return renderHome();const name=visible.id.replace('View','');if(name==='project')renderProject();else showView(name)}
function openMyProject(){if(USER.project_id)openProject(USER.project_id);else showView('projects')}
function renderHome(){const root=$('#homeView');if(isDirection){const all=state.projects;const totalMilestones=all.reduce((a,p)=>a+p.milestones.length,0);const open=state.dependencies.filter(d=>d.status!=='Resolvida').length;const analysis=state.dependencies.filter(d=>d.status==='Em análise').length;root.innerHTML=`<div class="hero"><div><h1>Visão da Transformação</h1><p>Panorama executivo dos sete projetos estruturantes.</p></div></div><div class="grid-kpi"><div class="kpi"><strong>${all.length}</strong><span>Projetos</span></div><div class="kpi"><strong>${totalMilestones}</strong><span>Marcos</span></div><div class="kpi"><strong>${open}</strong><span>Pendências abertas</span></div><div class="kpi"><strong>${analysis}</strong><span>Em análise</span></div></div>${projectsCard(all)}<div class="section-title"><h2>Pendências externas</h2><button class="btn light small" onclick="showView('director')">Ver todas</button></div>${depsCard(state.dependencies.filter(d=>d.status!=='Resolvida').slice(0,6),true)}`}
else{const p=project(USER.project_id);const c=counts(p);const mine=state.dependencies.filter(d=>d.projectId===p.id&&d.requester===USER.display_name&&d.status!=='Resolvida');root.innerHTML=`<div class="hero"><div><h1>Olá, ${esc(USER.display_name.split(' ')[0])}!</h1><p>Seu painel de acompanhamento da Transformação KAZ.</p></div></div><div class="card owner-project clickable" onclick="openProject('${p.id}')"><div><span class="muted" style="font-size:11px">Seu projeto</span><h2>${esc(p.name)}</h2></div><div class="count"><strong>1</strong>projeto<br><span>${c.total} marcos</span></div></div><div class="grid-kpi"><div class="kpi"><strong>${c.and}</strong><span>Marcos em andamento</span></div><div class="kpi"><strong>${c.total-c.done-c.and-c.risk}</strong><span>Não iniciados</span></div><div class="kpi"><strong>${c.risk}</strong><span>Em risco</span></div><div class="kpi"><strong>${c.done}</strong><span>Concluídos</span></div></div><div class="two"><div><div class="section-title"><h2>Compromissos da semana</h2></div>${commitmentsCard(p)}</div><div><div class="section-title"><h2>Suas pendências externas</h2><button class="btn light small" onclick="showView('dependencies')">Ver todas</button></div>${depsCard(mine.slice(0,5),false)}</div></div><div class="section-title"><h2>Outros projetos</h2><span class="muted" style="font-size:11px">Somente consulta</span></div>${projectsCard(state.projects.filter(x=>x.id!==p.id))}`}
}
function projectsCard(list){return `<div class="card"><table class="project-table"><thead><tr><th>Projeto</th><th>Responsável</th><th>Status</th><th>Marcos</th><th>Pendências</th><th></th></tr></thead><tbody>${list.map(p=>{const c=counts(p),ds=state.dependencies.filter(d=>d.projectId===p.id&&d.status!=='Resolvida').length;return `<tr class="clickable" onclick="openProject('${p.id}')"><td><b>${esc(p.name)}</b></td><td>${esc(p.owner)}</td><td>${badge(p.status)}</td><td>${c.done} / ${c.total}</td><td>${ds}</td><td>›</td></tr>`}).join('')}</tbody></table></div>`}
function renderProjects(){const root=$('#projectsView');root.innerHTML=`<div class="hero"><div><h1>Projetos</h1><p>Todos podem acompanhar todos os projetos. A edição respeita a alocação de cada responsável.</p></div></div>${projectsCard(state.projects)}`}
function openProject(id){currentProjectId=id;currentTab='overview';document.querySelectorAll('.view').forEach(v=>v.classList.add('hidden'));$('#projectView').classList.remove('hidden');navActive(USER.project_id===id?'myproject':'projects');renderProject();window.scrollTo({top:0,behavior:'smooth'})}
function renderProject(){const p=project(currentProjectId);if(!p)return;const editable=canEdit(p.id),c=counts(p),dps=state.dependencies.filter(d=>d.projectId===p.id);$('#projectView').innerHTML=`<button class="btn light small" onclick="showView('projects')">← Todos os projetos</button><div class="detail-head" style="margin-top:15px"><div><div class="muted" style="font-size:10px;text-transform:uppercase">Projeto de transformação</div><h1>${esc(p.name)}</h1><div class="muted" style="font-size:12px">Responsável: <b>${esc(p.owner)}</b> · ${editable?'Edição habilitada':'Modo consulta'}</div></div><div class="flex">${badge(p.status)} ${isDirection?`<button class="btn light small" onclick="toggleValidation()">${p.validated?'✓ Validado':'Validar pela Direção'}</button>`:''}</div></div><div class="tabs"><button class="tab ${currentTab==='overview'?'active':''}" onclick="projectTab('overview')">Visão geral</button><button class="tab ${currentTab==='milestones'?'active':''}" onclick="projectTab('milestones')">Marcos (${c.total})</button><button class="tab ${currentTab==='dependencies'?'active':''}" onclick="projectTab('dependencies')">Pendências (${dps.filter(d=>d.status!=='Resolvida').length})</button><button class="tab ${currentTab==='commitments'?'active':''}" onclick="projectTab('commitments')">Compromissos</button><button class="tab ${currentTab==='history'?'active':''}" onclick="projectTab('history')">Registros</button></div><div id="projectPanel"></div>`;renderProjectPanel()}
function projectTab(t){currentTab=t;renderProject()}
function renderProjectPanel(){const p=project(currentProjectId),editable=canEdit(p.id),root=$('#projectPanel');if(currentTab==='overview'){root.innerHTML=`<div class="two"><div class="card"><div class="card-h"><h3>Objetivo do projeto</h3>${editable?'<button class="btn light small" onclick="editObjective()">Editar</button>':''}</div><div class="pad objective">${esc(p.objective)}</div></div><div class="card"><div class="card-h"><h3>Status</h3></div><div class="pad"><div class="field"><label>Status atual</label><select ${editable?'':'disabled'} onchange="setProjectStatus(this.value)">${['Não iniciado','Em andamento','Em risco','Concluído'].map(s=>`<option ${p.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div style="margin-top:14px;font-size:12px">${p.validated?'<span class="pill s-conc">✓ Validado pela Direção</span>':'<span class="muted">Ainda não validado pela Direção</span>'}</div></div></div></div><div class="section-title"><h2>Marcos</h2><button class="btn light small" onclick="projectTab('milestones')">Ver todos</button></div>${milestonesCard(p.milestones.slice(0,4),editable)}<div class="section-title"><h2>Memorando geral</h2></div>${memosCard(p.generalMemos)}${editable?`<div class="flex" style="margin-top:10px"><input id="generalMemo" placeholder="Registrar evolução do projeto..." style="flex:1;border:1px solid #d6dde5;border-radius:8px;padding:9px"><button class="btn" onclick="addGeneralMemo()">Registrar</button></div>`:''}`}
if(currentTab==='milestones')root.innerHTML=milestonesCard(p.milestones,editable,true);
if(currentTab==='dependencies'){const list=state.dependencies.filter(d=>d.projectId===p.id);root.innerHTML=`<div class="section-title"><h2>Pendências externas</h2>${editable?'<button class="btn blue" onclick="openDependencyModal()">＋ Nova pendência</button>':''}</div><div class="notice">Pendências externas só podem ser direcionadas a um único membro da Diretoria: Rachid, Leo, Márcio ou Marcinho.</div><div style="margin-top:12px">${depsCard(list,false)}</div>`}
if(currentTab==='commitments'){root.innerHTML=`<div class="section-title"><h2>Compromissos da semana</h2>${editable?'<button class="btn blue" onclick="openCommitmentModal()">＋ Novo compromisso</button>':''}</div>${commitmentsCard(p,true)}`}
if(currentTab==='history'){const meetings=state.meetings.filter(m=>m.projectId===p.id).slice().reverse();root.innerHTML=`<div class="card"><div class="card-h"><h3>Registros do projeto</h3></div><div class="pad"><h4 style="margin-top:0">Memorandos</h4>${memosCard(p.generalMemos)}<h4>Reuniões</h4>${meetings.length?meetings.map(m=>`<div class="message"><strong>${fmtDate(m.at)} · ${esc(m.createdBy)}</strong><p>${esc(m.notes||'Sem anotações')}</p>${m.decisions?`<p><b>Decisões:</b> ${esc(m.decisions)}</p>`:''}${m.nextWeek?`<p><b>Próxima semana:</b> ${esc(m.nextWeek)}</p>`:''}</div>`).join(''):'<div class="empty">Nenhuma reunião registrada.</div>'}</div></div>`}
}
function milestonesCard(list,editable,full=false){return `<div class="card"><div class="pad">${list.map((m,i)=>`<div class="milestone"><div class="m-row"><div><div class="m-name">${i+1}. ${esc(m.name)}</div>${m.deadline?`<div class="muted" style="font-size:10px;margin-top:3px">Prazo: ${esc(m.deadline)}</div>`:''}</div><div>${badge(m.status)}</div><div>${esc(m.deadline||'Sem prazo')}</div><button class="btn light small" onclick="toggleMilestone('${m.id}')">${editable?'Abrir':'Ver'}</button></div><div id="md-${m.id}" class="m-detail hidden">${editable?`<div class="form-grid"><div class="field"><label>Status</label><select id="ms-${m.id}">${['Não iniciado','Em andamento','Em risco','Concluído'].map(s=>`<option ${m.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Prazo</label><input id="dl-${m.id}" type="date" value="${esc(m.deadline||'')}"></div><div class="field full"><label>Conclusão</label><textarea id="co-${m.id}">${esc(m.conclusion||'')}</textarea></div><div class="field full"><label>Novo memorando</label><textarea id="mm-${m.id}" placeholder="Registre evolução, decisão ou contexto..."></textarea></div></div><div class="actions"><button class="btn" onclick="saveMilestone('${m.id}')">Salvar</button></div>`:`${m.conclusion?`<p><b>Conclusão:</b> ${esc(m.conclusion)}</p>`:''}${m.memos?.length?memosCard(m.memos):'<span class="muted">Sem registros adicionais.</span>'}`}</div></div>`).join('')}</div></div>`}
function toggleMilestone(id){document.getElementById('md-'+id).classList.toggle('hidden')}
async function saveMilestone(id){try{await api(`/api/projects/${currentProjectId}`,'POST',{action:'milestone',milestoneId:id,status:$('#ms-'+id).value,deadline:$('#dl-'+id).value,conclusion:$('#co-'+id).value,memo:$('#mm-'+id).value});await refresh();renderProject()}catch(e){alert(e.message)}}
async function setProjectStatus(status){try{await api(`/api/projects/${currentProjectId}`,'POST',{action:'status',status});await refresh();renderProject()}catch(e){alert(e.message)}}
async function toggleValidation(){const p=project(currentProjectId);try{await api(`/api/projects/${p.id}`,'POST',{action:'validated',value:!p.validated});await refresh();renderProject()}catch(e){alert(e.message)}}
function editObjective(){const p=project(currentProjectId);modal(`<h2>Editar objetivo</h2><div class="field"><textarea id="objectiveEdit" style="min-height:160px">${esc(p.objective)}</textarea></div><div class="actions"><button class="btn light" onclick="closeModal()">Cancelar</button><button class="btn" onclick="saveObjective()">Salvar</button></div>`)}
async function saveObjective(){try{await api(`/api/projects/${currentProjectId}`,'POST',{action:'objective',objective:$('#objectiveEdit').value});closeModal();await refresh();renderProject()}catch(e){alert(e.message)}}
function memosCard(ms=[]){if(!ms.length)return '<div class="empty">Nenhum registro ainda.</div>';return ms.slice().reverse().map(m=>`<div class="message"><strong>${esc(m.author||'Sistema')} · ${fmtDate(m.at)}</strong><p>${esc(m.text)}</p></div>`).join('')}
async function addGeneralMemo(){const text=$('#generalMemo').value.trim();if(!text)return;try{await api(`/api/projects/${currentProjectId}`,'POST',{action:'general_memo',text});await refresh();renderProject()}catch(e){alert(e.message)}}
function commitmentsCard(p,manage=false){const list=p.weeklyCommitments||[];if(!list.length)return '<div class="card empty">Nenhum compromisso da semana registrado.</div>';return `<div class="card"><div class="pad">${list.map(c=>`<div class="message"><div class="flex"><strong>${esc(c.text)}</strong><span class="right">${badgeCommit(c.status)}</span></div><small class="muted">${esc(c.author||'')} · ${fmtDate(c.createdAt)}</small>${manage&&canEdit(p.id)?`<div class="flex" style="margin-top:8px"><button class="btn light small" onclick="commitStatus('${c.id}','Realizado')">Realizado</button><button class="btn light small" onclick="commitStatus('${c.id}','Parcial')">Parcial</button><button class="btn light small" onclick="commitStatus('${c.id}','Não realizado')">Não realizado</button></div>`:''}</div>`).join('')}</div></div>`}
function badgeCommit(s){return `<span class="pill ${s==='Realizado'?'s-conc':s==='Parcial'?'s-analise':s==='Não realizado'?'s-risco':'s-nao'}">${esc(s||'Aberto')}</span>`}
function openCommitmentModal(){modal(`<h2>Novo compromisso da semana</h2><div class="field"><label>Resultado esperado até a próxima reunião</label><textarea id="commitText" style="min-height:120px"></textarea></div><div class="actions"><button class="btn light" onclick="closeModal()">Cancelar</button><button class="btn" onclick="saveCommitment()">Salvar</button></div>`)}
async function saveCommitment(){try{await api(`/api/projects/${currentProjectId}`,'POST',{action:'weekly_commitment',text:$('#commitText').value});closeModal();await refresh();renderProject()}catch(e){alert(e.message)}}
async function commitStatus(id,status){try{await api(`/api/projects/${currentProjectId}`,'POST',{action:'commitment_status',commitmentId:id,status});await refresh();renderProject()}catch(e){alert(e.message)}}
function depsCard(list,director){if(!list.length)return '<div class="card empty">Nenhuma pendência externa.</div>';return `<div class="card"><table class="dep-table"><thead><tr><th>Projeto</th><th>Assunto</th><th>Diretor</th><th>Prazo</th><th>Status</th><th></th></tr></thead><tbody>${list.map(d=>`<tr class="clickable" onclick="openDependency('${d.id}')"><td>${esc(d.projectName||project(d.projectId)?.name)}</td><td><b>${esc(d.subject)}</b><br><span class="muted">${esc(d.requester)}</span></td><td>${esc(d.director)}</td><td>${esc(d.deadline||'—')}</td><td>${badge(d.status)}</td><td>›</td></tr>`).join('')}</tbody></table></div>`}
function renderDependencies(){const mine=isDirection?state.dependencies:state.dependencies.filter(d=>d.projectId===USER.project_id);$('#dependenciesView').innerHTML=`<div class="hero"><div><h1>Pendências externas</h1><p>${isDirection?'Todas as pendências dos projetos.':'Pendências do seu projeto e respostas da Diretoria.'}</p></div>${USER.project_id?'<button class="btn blue" onclick="openDependencyModal()">＋ Nova pendência</button>':''}</div>${depsCard(mine,false)}`}
function renderDirector(){if(!isDirection){showView('home');return}$('#directorView').innerHTML=`<div class="hero"><div><h1>Pendências da Diretoria</h1><p>Visão consolidada. Cada pendência tem um diretor responsável, mas a Diretoria pode trabalhar coletivamente.</p></div></div><div class="grid-kpi"><div class="kpi"><strong>${state.dependencies.filter(d=>d.status==='Aberta').length}</strong><span>Abertas</span></div><div class="kpi"><strong>${state.dependencies.filter(d=>d.status==='Em análise').length}</strong><span>Em análise</span></div><div class="kpi"><strong>${state.dependencies.filter(d=>d.status==='Respondida').length}</strong><span>Respondidas</span></div><div class="kpi"><strong>${state.dependencies.filter(d=>d.status==='Resolvida').length}</strong><span>Resolvidas</span></div></div>${depsCard(state.dependencies,true)}`}
function openDependencyModal(){const pid=currentProjectId&&canEdit(currentProjectId)?currentProjectId:USER.project_id;if(!pid&&!isDirection)return;const opts=(isDirection?state.projects:[project(pid)]).map(p=>`<option value="${p.id}" ${p.id===pid?'selected':''}>${esc(p.name)}</option>`).join('');modal(`<h2>Nova pendência externa</h2><div class="form-grid"><div class="field"><label>Projeto de origem</label><select id="depProject">${opts}</select></div><div class="field"><label>Diretor responsável</label><select id="depDirector">${DIRECTORS.map(d=>`<option>${esc(d)}</option>`).join('')}</select></div><div class="field full"><label>Assunto</label><input id="depSubject" placeholder="Ex.: Política de desconto para carteiras"></div><div class="field full"><label>O que você precisa da Diretoria?</label><textarea id="depDescription" style="min-height:120px"></textarea></div><div class="field"><label>Prazo</label><input id="depDeadline" type="date"></div></div><div class="actions"><button class="btn light" onclick="closeModal()">Cancelar</button><button class="btn" onclick="saveDependency()">Abrir pendência</button></div>`)}
async function saveDependency(){try{await api('/api/dependencies','POST',{projectId:$('#depProject').value,director:$('#depDirector').value,subject:$('#depSubject').value,description:$('#depDescription').value,deadline:$('#depDeadline').value});closeModal();await refresh();if(currentProjectId)renderProject();else renderDependencies()}catch(e){alert(e.message)}}
function openDependency(id){const d=dep(id),p=project(d.projectId),own=USER.project_id===d.projectId,assigned=USER.display_name===d.director;modal(`<div class="flex"><div><span class="muted" style="font-size:10px">${esc(p.name)} · ${esc(d.requester)}</span><h2 style="margin:3px 0">${esc(d.subject)}</h2></div><div class="right">${badge(d.status)}</div></div><div class="grid-kpi" style="grid-template-columns:repeat(3,1fr)"><div class="kpi"><span>Diretor responsável</span><strong style="font-size:16px">${esc(d.director)}</strong></div><div class="kpi"><span>Prazo</span><strong style="font-size:16px">${esc(d.deadline||'—')}</strong></div><div class="kpi"><span>Projeto</span><strong style="font-size:16px">${esc(p.name)}</strong></div></div><div class="card"><div class="card-h"><h3>Solicitação</h3></div><div class="pad objective">${esc(d.description)}</div></div><div class="section-title"><h2>Conversa</h2></div><div id="depMessages">${(d.messages||[]).map(m=>`<div class="message ${m.role==='Diretoria'?'dir':''}"><strong>${esc(m.author)} · ${esc(m.role)} · ${fmtDate(m.at)}</strong><p>${esc(m.text)}</p>${m.final?'<span class="pill s-resp">Resposta final</span>':''}</div>`).join('')||'<div class="empty">Nenhuma interação ainda.</div>'}</div><div class="section-title"><h2>Histórico</h2></div><div class="timeline">${(d.history||[]).slice().reverse().map(h=>`<div class="event"><b style="font-size:11px">${esc(h.actor)}</b> <small>· ${fmtDate(h.at)}</small><div style="font-size:12px;margin-top:3px">${esc(h.text||h.kind)}</div>${h.reason?`<div class="muted" style="font-size:11px">Motivo: ${esc(h.reason)}</div>`:''}</div>`).join('')}</div><div class="section-title"><h2>Ações</h2></div><div class="flex" style="flex-wrap:wrap">${isDirection&&assigned&&d.status==='Aberta'?`<button class="btn blue" onclick="depAction('${d.id}','assume')">Assumir</button>`:''}${isDirection&&d.status!=='Resolvida'?`<button class="btn" onclick="replyDependency('${d.id}')">Responder</button>`:''}${(isDirection||own)&&d.status!=='Resolvida'?`<button class="btn green" onclick="resolveDependency('${d.id}')">Marcar resolvida</button>`:''}${d.status==='Resolvida'&&(isDirection||own||assigned)?`<button class="btn light" onclick="reopenDependency('${d.id}')">Reabrir</button>`:''}${isDirection?`<button class="btn light" onclick="reassignDependency('${d.id}')">Trocar diretor</button>`:''}${(isDirection||own)&&d.status!=='Resolvida'?`<button class="btn light" onclick="commentDependency('${d.id}')">Adicionar informação</button>`:''}</div><div class="actions"><button class="btn light" onclick="closeModal()">Fechar</button></div>`)}
async function depAction(id,action,body={}){try{await api(`/api/dependencies/${id}/${action}`,'POST',body);closeModal();await refresh();renderCurrent()}catch(e){alert(e.message)}}
function replyDependency(id){const text=prompt('Digite a resposta da Diretoria:');if(!text)return;const final=confirm('Esta é a resposta final?\nOK = marcar como Respondida.\nCancelar = manter Em análise.');depAction(id,'reply',{text,final})}
function commentDependency(id){const text=prompt('Adicionar informação/comentário:');if(text)depAction(id,'comment',{text})}
function resolveDependency(id){const note=prompt('Conclusão da resolução (opcional):')||'';if(confirm('Marcar esta pendência como Resolvida?'))depAction(id,'resolve',{note})}
function reopenDependency(id){const reason=prompt('Motivo obrigatório da reabertura:');if(reason&&reason.trim())depAction(id,'reopen',{reason})}
function reassignDependency(id){const d=dep(id);const director=prompt('Novo diretor responsável: Rachid, Leo, Márcio ou Marcinho',d.director);if(!DIRECTORS.includes(director)){if(director!==null)alert('Diretor inválido.');return}const reason=prompt('Motivo da alteração (opcional):')||'';depAction(id,'reassign',{director,reason})}
function renderMeeting(){const options=(isDirection?state.projects:[project(USER.project_id)]).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');$('#meetingView').innerHTML=`<div class="hero"><div><h1>Modo Reunião</h1><p>Registro simples da reunião, decisões e compromisso da próxima semana.</p></div></div><div class="card pad"><div class="field"><label>Projeto</label><select id="meetProject">${options}</select></div><div class="meeting-box"><h3>Andamento da reunião</h3><textarea id="meetNotes" placeholder="O que aconteceu desde a última reunião? Pontos discutidos, contexto, evolução..."></textarea></div><div class="meeting-box"><h3>Decisões tomadas</h3><textarea id="meetDecisions" placeholder="Decisões efetivamente tomadas pela reunião..."></textarea></div><div class="meeting-box"><h3>Próxima semana</h3><textarea id="meetNext" placeholder="Resultados e compromissos até a próxima reunião..."></textarea></div><div class="actions"><button class="btn blue" onclick="saveMeeting()">Fechar e registrar reunião</button></div></div>`}
async function saveMeeting(){try{await api('/api/meetings','POST',{projectId:$('#meetProject').value,notes:$('#meetNotes').value,decisions:$('#meetDecisions').value,nextWeek:$('#meetNext').value});alert('Reunião registrada.');await refresh();renderMeeting()}catch(e){alert(e.message)}}
function modal(html){$('#modalRoot').innerHTML=`<div class="modal-wrap" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`}
function closeModal(){$('#modalRoot').innerHTML=''}
function init(){ $('#avatar').textContent=initials(USER.display_name);$('#userName').textContent=USER.display_name;$('#userRole').textContent=isDirection?'Diretoria':project(USER.project_id)?.name||USER.role;document.querySelectorAll('.directionOnly').forEach(x=>x.classList.toggle('hidden',!isDirection));document.querySelectorAll('.adminOnly').forEach(x=>x.classList.toggle('hidden',USER.role!=='admin'));$('#myProjectNav').classList.toggle('hidden',!USER.project_id);renderHome();}
init();
</script>
</body></html>
