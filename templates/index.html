<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transformação KAZ</title>
<style>
:root{--ink:#102038;--muted:#6b778c;--line:#e6ebf1;--bg:#f6f8fb;--card:#fff;--nav:#fbfcfe;--blue:#2563eb;--green:#0f9f6e;--amber:#d97706;--red:#dc2626;--shadow:0 10px 28px rgba(15,23,42,.045)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea,select{font:inherit}.app{display:grid;grid-template-columns:225px 1fr;min-height:100vh}.side{background:var(--nav);border-right:1px solid var(--line);padding:18px 13px;position:sticky;top:0;height:100vh}.brand{font-size:28px;font-weight:850;letter-spacing:-1px;padding:3px 10px 24px}.brand small{font-size:10px;display:block;letter-spacing:1.8px;color:#8a96a8;font-weight:650;text-transform:uppercase}.nav{display:grid;gap:4px}.nav button,.nav a{border:0;background:transparent;color:#43516a;padding:10px 11px;border-radius:9px;text-align:left;cursor:pointer;text-decoration:none;font-size:13px;display:flex;gap:9px;align-items:center}.nav button:hover,.nav button.active,.nav a:hover{background:#edf3fa;color:#0f2747}.nav .sep{height:1px;background:var(--line);margin:8px 5px}.ico{width:18px;text-align:center;color:#607089}.main{min-width:0}.top{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 24px;position:sticky;top:0;z-index:15}.top-title{font-size:14px;font-weight:750}.userbox{display:flex;align-items:center;gap:10px;font-size:12px}.avatar{width:32px;height:32px;border-radius:50%;background:#24364f;color:#fff;display:grid;place-items:center;font-weight:800;font-size:11px}.userbox small{display:block;color:var(--muted);font-size:10px}.content{padding:24px;max-width:1500px;margin:0 auto}.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:15px;margin-bottom:18px}.hero h1{font-size:25px;margin:0;letter-spacing:-.5px}.hero p{color:var(--muted);font-size:12px;margin:5px 0 0}.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.metric{padding:17px}.metric span{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.6px}.metric b{font-size:28px;display:block;margin-top:4px}.section{margin-top:16px}.section-head{display:flex;justify-content:space-between;align-items:center;margin:0 0 9px}.section-head h2{font-size:15px;margin:0}.section-head p{font-size:11px;color:var(--muted);margin:3px 0 0}.panel{padding:16px}.project-focus{padding:18px;display:flex;justify-content:space-between;align-items:center;gap:16px;cursor:pointer}.project-focus .eyebrow{font-size:10px;color:var(--muted);text-transform:uppercase}.project-focus h2{margin:4px 0;font-size:22px}.project-focus p{margin:0;color:var(--muted);font-size:12px}.bigcount{text-align:right;white-space:nowrap}.bigcount b{font-size:24px;display:block}.bigcount span{font-size:11px;color:var(--muted)}.table{width:100%;border-collapse:collapse;font-size:12px}.table th{text-align:left;color:#7a879b;font-size:10px;font-weight:700;padding:9px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.3px}.table td{padding:11px 9px;border-bottom:1px solid #eef2f6;vertical-align:middle}.table tr:last-child td{border-bottom:0}.table tr.click{cursor:pointer}.table tr.click:hover td{background:#fbfdff}.pill{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;font-size:10px;font-weight:700;white-space:nowrap}.s-gray{background:#edf1f5;color:#556276}.s-green{background:#dcfce7;color:#16734b}.s-amber{background:#fff3d6;color:#9a5a00}.s-red{background:#fee2e2;color:#a11b1b}.s-blue{background:#dbeafe;color:#2059a8}.btn{border:0;background:#172b46;color:#fff;border-radius:9px;padding:9px 12px;font-size:12px;font-weight:700;cursor:pointer}.btn:hover{filter:brightness(.97)}.btn.light{background:#eef3f8;color:#263a55}.btn.outline{background:#fff;color:#263a55;border:1px solid #d9e1ea}.btn.red{background:#fee2e2;color:#991b1b}.btn.green{background:#dcfce7;color:#166534}.btn.small{padding:6px 8px;font-size:10px}.btn:disabled{opacity:.45;cursor:not-allowed}.muted{color:var(--muted)}.tiny{font-size:10px}.empty{padding:26px;text-align:center;color:var(--muted);font-size:12px;border:1px dashed #d8e0ea;border-radius:11px;background:#fbfcfe}.split{display:grid;grid-template-columns:1.35fr .65fr;gap:14px}.project-head{padding:20px}.crumb{font-size:10px;color:var(--muted);margin-bottom:10px}.project-title{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.project-title h1{margin:0;font-size:26px}.project-title .owner{text-align:right;font-size:11px;color:var(--muted)}.project-title .owner b{display:block;color:var(--ink);font-size:13px;margin-top:3px}.objective{font-size:13px;line-height:1.55;color:#45546a}.tabs{display:flex;gap:4px;overflow:auto;border-bottom:1px solid var(--line);padding:0 16px;background:#fff}.tabs button{border:0;background:transparent;padding:12px 10px;cursor:pointer;font-size:11px;color:#66758a;border-bottom:2px solid transparent;white-space:nowrap}.tabs button.active{color:#0e2a4c;border-bottom-color:#0e2a4c;font-weight:750}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:10px;color:var(--muted);font-weight:650}.field input,.field textarea,.field select{width:100%;border:1px solid #d8e0e9;border-radius:9px;padding:9px 10px;background:#fff;color:var(--ink);outline:none}.field textarea{min-height:84px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:#8ba0b8}.field input:disabled,.field textarea:disabled,.field select:disabled{background:#f4f6f8;color:#6f7c8d}.milestone{border-top:1px solid #eef2f6;padding:12px 0;display:grid;grid-template-columns:28px 1fr auto auto;gap:10px;align-items:center;cursor:pointer}.milestone:first-child{border-top:0}.milestone:hover{background:#fbfdff}.num{width:22px;height:22px;border-radius:50%;background:#eef3f8;display:grid;place-items:center;font-size:10px;font-weight:800}.milestone b{font-size:12px}.milestone small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.commit{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid #eef2f6}.commit:first-child{border-top:0}.commit .grow{flex:1;font-size:12px}.memo{padding:10px 0;border-top:1px solid #eef2f6}.memo:first-child{border-top:0}.memo b{font-size:11px}.memo p{font-size:12px;margin:4px 0;color:#46546a;line-height:1.45}.memo small{font-size:9px;color:#8c98a8}.file{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid #eef2f6;font-size:11px}.file:first-child{border-top:0}.link{color:#2563eb;cursor:pointer;text-decoration:none}.save-state{font-size:10px;color:#7b8898}.modal-wrap{position:fixed;inset:0;background:rgba(15,23,42,.46);z-index:100;display:flex;justify-content:flex-end}.modal{width:min(620px,100vw);height:100vh;background:#fff;overflow:auto;box-shadow:-20px 0 45px rgba(15,23,42,.15)}.modal.wide{width:min(820px,100vw)}.modal-head{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:18px 20px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;z-index:3}.modal-head h2{font-size:18px;margin:0}.modal-body{padding:20px}.close{border:0;background:#eef2f6;width:30px;height:30px;border-radius:50%;cursor:pointer}.history{position:relative;padding-left:22px}.history:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:1px;background:#dfe6ee}.hist{position:relative;padding:0 0 18px 10px}.hist:before{content:"";position:absolute;left:-19px;top:4px;width:9px;height:9px;border-radius:50%;background:#2d5b88}.hist b{font-size:11px}.hist p{font-size:11px;margin:3px 0;color:#4d5b6f;line-height:1.45}.hist small{font-size:9px;color:#8c98a8}.dep-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:14px}.dep-summary div{background:#f7f9fc;border:1px solid #e9eef4;border-radius:10px;padding:10px}.dep-summary span{font-size:9px;color:var(--muted);display:block}.dep-summary b{font-size:11px;display:block;margin-top:3px}.actionbar{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}.notice{padding:10px 12px;border-radius:10px;background:#eef6ff;color:#264b72;font-size:11px;border:1px solid #d6e9fb}.meeting{max-width:1100px;margin:0 auto}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:14px}.step{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:10px;color:var(--muted)}.step.active{border-color:#244768;color:#173552;font-weight:750}.meeting-card{padding:20px}.meeting-card h2{margin:0 0 5px;font-size:18px}.meeting-card>p{margin:0 0 18px;color:var(--muted);font-size:11px}.meeting-nav{display:flex;justify-content:space-between;gap:8px;margin-top:18px}.result-row{display:grid;grid-template-columns:1fr 160px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid #eef2f6}.hidden{display:none!important}.readonly{font-size:10px;color:#7a8798;background:#f1f4f7;padding:5px 8px;border-radius:999px}.toolbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.callout{padding:13px;border-radius:11px;background:#f8fafc;border:1px solid var(--line);font-size:11px;color:#526175}.toast{position:fixed;right:20px;bottom:20px;z-index:200;background:#122338;color:#fff;padding:11px 14px;border-radius:10px;font-size:11px;box-shadow:0 10px 30px rgba(0,0,0,.16)}@media(max-width:1000px){.app{grid-template-columns:1fr}.side{display:none}.content{padding:16px}.g4,.g3,.g2,.split{grid-template-columns:1fr}.top{padding:0 15px}.dep-summary{grid-template-columns:1fr 1fr}.project-title{flex-direction:column}.project-title .owner{text-align:left}.table{min-width:760px}.table-wrap{overflow:auto}.steps{grid-template-columns:1fr 1fr}}
</style></head><body>
<div class="app"><aside class="side"><div class="brand">KAZ<small>Transformação</small></div><div id="nav" class="nav"></div></aside><main class="main"><header class="top"><div><div class="top-title" id="topTitle">Transformação KAZ</div><div class="save-state" id="saveState">Sincronizado</div></div><div class="userbox"><div class="avatar" id="avatar"></div><div><b id="userName"></b><small id="userRole"></small></div></div></header><div class="content" id="content"></div></main></div><div id="modalRoot"></div><div id="toast" class="toast hidden"></div>
<script>
let state={{ initial_state|tojson }};let revision={{ revision|int }};const USER={{ user|tojson }};const CSRF={{ csrf|tojson }};const PROJECT_STATUSES={{ project_statuses|tojson }};const DEPENDENCY_STATUSES={{ dependency_statuses|tojson }};const DIRECTORS={{ directors|tojson }};let currentView='home',activeProjectId=USER.project_id||null,activeTab='overview',meetingDraft=null,meetingStep=1;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));function initials(n){return(n||'?').split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase()}function fmtDate(v){if(!v)return'—';let d=new Date(v);if(String(v).length===10)d=new Date(v+'T12:00:00');return isNaN(d)?esc(v):d.toLocaleDateString('pt-BR')}function fmtDateTime(v){if(!v)return'—';let d=new Date(v);return isNaN(d)?esc(v):d.toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}function pById(id){return state.projects.find(p=>p.id===id)}function dById(id){return state.dependencies.find(d=>String(d.id)===String(id))}function canEdit(pid){return USER.is_director||USER.project_id===pid}function isOwner(pid){return USER.role==='owner'&&USER.project_id===pid}function sc(s){return s==='Concluído'||s==='Resolvida'||s==='Respondida'?'s-green':s==='Em andamento'||s==='Em análise'?'s-blue':s==='Em risco'||s==='Aberta'?'s-red':'s-gray'}function pill(s){return`<span class="pill ${sc(s)}">${esc(s)}</span>`}function toast(msg){let t=$('#toast');t.textContent=msg;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2200)}function setSave(txt){$('#saveState').textContent=txt}function projectStats(p){let m=p.milestones||[];return{total:m.length,done:m.filter(x=>x.status==='Concluído').length,risk:m.filter(x=>x.status==='Em risco').length,doing:m.filter(x=>x.status==='Em andamento').length}}function openDepsFor(pid){return(state.dependencies||[]).filter(d=>d.projectId===pid&&d.status!=='Resolvida')}function renderNav(){let owner=USER.role==='owner',items=`<button data-v="home" onclick="goView('home')"><span class="ico">⌂</span>Início</button>`;if(owner)items+=`<button data-v="my" onclick="openProject('${USER.project_id}')"><span class="ico">▣</span>Meu Projeto</button>`;items+=`<button data-v="projects" onclick="goView('projects')"><span class="ico">▦</span>Projetos</button><button data-v="dependencies" onclick="goView('dependencies')"><span class="ico">◉</span>${USER.is_director?'Pendências (Diretoria)':'Pendências'}</button><button data-v="meeting" onclick="goView('meeting')"><span class="ico">▱</span>Modo Reunião</button>`;if(USER.role==='admin')items+=`<div class="sep"></div><a href="/admin/users"><span class="ico">♙</span>Usuários</a>`;items+=`<div class="sep"></div><a href="/logout"><span class="ico">↪</span>Sair</a>`;$('#nav').innerHTML=items;syncNav()}function syncNav(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.v===currentView))}function goView(v){currentView=v;activeTab='overview';syncNav();render()}function openProject(id){activeProjectId=id;currentView='project';activeTab='overview';syncNav();render()}function render(){let c=$('#content');if(currentView==='home')c.innerHTML=renderHome();else if(currentView==='projects')c.innerHTML=renderProjects();else if(currentView==='dependencies')c.innerHTML=renderDependencies();else if(currentView==='project')c.innerHTML=renderProject();else if(currentView==='meeting')c.innerHTML=renderMeetingSelector();$('#topTitle').textContent=currentView==='dependencies'&&USER.is_director?'Pendências da Diretoria':'Transformação KAZ'}function renderHome(){return USER.is_director?renderDirectorHome():renderOwnerHome()}
function renderOwnerHome(){let p=pById(USER.project_id),st=projectStats(p),deps=openDepsFor(p.id),comm=p.weeklyCommitments||[];return`<div class="hero"><div><h1>Olá, ${esc(USER.display_name.split(' ')[0])}.</h1><p>Sua visão de trabalho na Transformação KAZ.</p></div></div><div class="card project-focus" onclick="openProject('${p.id}')"><div><div class="eyebrow">Seu projeto</div><h2>${esc(p.name)}</h2><p>${pill(p.status)} &nbsp; Responsável: ${esc(p.owner)}</p></div><div class="bigcount"><b>1 projeto</b><span>${st.total} marcos</span></div></div><div class="grid g3 section"><div class="card metric"><span>Em andamento</span><b>${st.doing}</b></div><div class="card metric"><span>Concluídos</span><b>${st.done}</b></div><div class="card metric"><span>Pendências externas abertas</span><b>${deps.length}</b></div></div><div class="grid g2 section"><div class="card panel"><div class="section-head"><div><h2>Compromissos da semana</h2><p>Resultados combinados para o ciclo atual.</p></div><button class="btn light small" onclick="openProject('${p.id}');setTimeout(()=>setTab('commitments'),0)">Ver projeto</button></div>${comm.length?comm.map(x=>`<div class="commit"><div class="grow"><b>${esc(x.text||x)}</b></div>${pill(x.status||'Pendente')}</div>`).join(''):'<div class="empty">Nenhum compromisso registrado.</div>'}</div><div class="card panel"><div class="section-head"><div><h2>Suas pendências externas</h2><p>Solicitações abertas para a Diretoria.</p></div><button class="btn light small" onclick="goView('dependencies')">Ver todas</button></div>${deps.length?deps.slice(0,6).map(d=>`<div class="commit" onclick="openDependency('${d.id}')" style="cursor:pointer"><div class="grow"><b>${esc(d.subject)}</b><div class="tiny muted">${esc(d.director)} · prazo ${fmtDate(d.deadline)}</div></div>${pill(d.status)}</div>`).join(''):'<div class="empty">Nenhuma pendência externa aberta.</div>'}</div></div><div class="section"><div class="section-head"><div><h2>Outros projetos</h2><p>Visão de consulta da transformação inteira.</p></div><button class="btn light small" onclick="goView('projects')">Ver todos</button></div></div>`}
function renderDirectorHome(){let totalM=state.projects.reduce((a,p)=>a+(p.milestones||[]).length,0),open=(state.dependencies||[]).filter(d=>d.status!=='Resolvida'),analysis=open.filter(d=>d.status==='Em análise').length;return`<div class="hero"><div><h1>Visão da Transformação</h1><p>Painel executivo dos sete projetos estruturantes.</p></div></div><div class="grid g4"><div class="card metric"><span>Projetos</span><b>${state.projects.length}</b></div><div class="card metric"><span>Marcos</span><b>${totalM}</b></div><div class="card metric"><span>Pendências abertas</span><b>${open.length}</b></div><div class="card metric"><span>Em análise</span><b>${analysis}</b></div></div><div class="section card panel"><div class="section-head"><div><h2>Projetos</h2><p>Status, marcos e dependências.</p></div><button class="btn light small" onclick="goView('projects')">Ver todos</button></div>${projectTable(state.projects)}</div><div class="section card panel"><div class="section-head"><div><h2>Pendências externas</h2><p>Fila consolidada da Diretoria.</p></div><button class="btn light small" onclick="goView('dependencies')">Abrir painel</button></div>${dependencyTable(open.slice(0,8))}</div>`}
function projectTable(projects){return`<div class="table-wrap"><table class="table"><thead><tr><th>Projeto</th><th>Responsável</th><th>Status</th><th>Marcos</th><th>Pendências</th><th></th></tr></thead><tbody>${projects.map(p=>{let s=projectStats(p);return`<tr class="click" onclick="openProject('${p.id}')"><td><b>${esc(p.name)}</b></td><td>${esc(p.owner)}</td><td>${pill(p.status)}</td><td>${s.done} / ${s.total}</td><td>${openDepsFor(p.id).length}</td><td>›</td></tr>`}).join('')}</tbody></table></div>`}function renderProjects(){return`<div class="hero"><div><h1>Projetos</h1><p>Todos podem consultar todos os projetos. Edição segue a responsabilidade de cada área.</p></div></div><div class="card panel">${projectTable(state.projects)}</div>`}
function renderProject(){let p=pById(activeProjectId);if(!p)return renderProjects();let editable=canEdit(p.id),s=projectStats(p),deps=openDepsFor(p.id);return`<div class="card project-head"><div class="crumb">Projetos › ${esc(p.name)}</div><div class="project-title"><div><div class="toolbar"><h1>${esc(p.name)}</h1>${p.validated?'<span class="pill s-green">Validado pela Direção</span>':''}${editable?'':'<span class="readonly">Somente leitura</span>'}</div><div style="margin-top:10px">${editable?`<select onchange="setProjectStatus('${p.id}',this.value)" style="border:1px solid #d9e1ea;border-radius:8px;padding:7px">${PROJECT_STATUSES.map(x=>`<option ${x===p.status?'selected':''}>${esc(x)}</option>`).join('')}</select>`:pill(p.status)}</div></div><div class="owner">Responsável<b>${esc(p.owner)}</b></div></div></div><div class="tabs">${[['overview','Visão Geral'],['milestones','Marcos'],['dependencies','Pendências'],['commitments','Compromissos'],['files','Arquivos'],['history','Histórico']].map(([id,l])=>`<button class="${activeTab===id?'active':''}" onclick="setTab('${id}')">${l}</button>`).join('')}</div><div class="card" style="border-top:0;border-top-left-radius:0;border-top-right-radius:0"><div class="panel">${renderProjectTab(p,editable,s,deps)}</div></div>`}function setTab(t){activeTab=t;render()}
function renderProjectTab(p,editable,s,deps){if(activeTab==='overview')return`<div class="grid g3"><div class="card metric" style="box-shadow:none"><span>Marcos</span><b>${s.done}/${s.total}</b></div><div class="card metric" style="box-shadow:none"><span>Em risco</span><b>${s.risk}</b></div><div class="card metric" style="box-shadow:none"><span>Pendências abertas</span><b>${deps.length}</b></div></div><div class="section"><div class="section-head"><div><h2>Objetivo do projeto</h2><p>Definição executiva da transformação.</p></div>${USER.is_director?`<button class="btn outline small" onclick="toggleValidation('${p.id}')">${p.validated?'Retirar validação':'Validar pela Direção'}</button>`:''}</div><div class="callout objective">${esc(p.objective)}</div></div><div class="section"><div class="section-head"><div><h2>Roadmap de marcos</h2><p>Clique para abrir detalhes.</p></div><button class="btn light small" onclick="setTab('milestones')">Ver todos</button></div>${milestoneList(p)}</div>`;if(activeTab==='milestones')return`<div class="section-head"><div><h2>Marcos (${p.milestones.length})</h2><p>Unidade central de acompanhamento do projeto.</p></div></div>${milestoneList(p)}`;if(activeTab==='dependencies')return`<div class="section-head"><div><h2>Pendências externas</h2><p>Somente quando o avanço depende da Diretoria.</p></div>${editable?`<button class="btn" onclick="newDependency('${p.id}')">＋ Nova pendência</button>`:''}</div>${dependencyTable((state.dependencies||[]).filter(d=>d.projectId===p.id))}`;if(activeTab==='commitments')return renderCommitments(p,editable);if(activeTab==='files')return renderFiles(p,editable);if(activeTab==='history')return renderProjectHistory(p);return''}
function milestoneList(p){return`<div>${p.milestones.map((m,i)=>`<div class="milestone" onclick="openMilestone('${p.id}','${m.id}')"><div class="num">${m.status==='Concluído'?'✓':i+1}</div><div><b>${esc(m.name)}</b><small>${m.deadline?'Prazo '+fmtDate(m.deadline):'Sem prazo definido'}</small></div>${pill(m.status)}<div>›</div></div>`).join('')}</div>`}function setProjectStatus(pid,status){let p=pById(pid);if(!canEdit(pid))return;p.status=status;p.lastUpdate=new Date().toISOString();p.history=p.history||[];p.history.push({at:new Date().toISOString(),actor:USER.display_name,action:'Status do projeto',detail:status});saveState(()=>render())}function toggleValidation(pid){if(!USER.is_director)return;let p=pById(pid);p.validated=!p.validated;p.history=p.history||[];p.history.push({at:new Date().toISOString(),actor:USER.display_name,action:p.validated?'Projeto validado pela Direção':'Validação retirada',detail:''});saveState(()=>render())}
function openMilestone(pid,mid){let p=pById(pid),m=p.milestones.find(x=>x.id===mid),editable=canEdit(pid);showModal(`<div class="modal-head"><div><div class="tiny muted">${esc(p.name)}</div><h2>${esc(m.name)}</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="form-row"><div class="field"><label>Status</label><select id="mStatus" ${editable?'':'disabled'}>${PROJECT_STATUSES.map(x=>`<option ${x===m.status?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>Prazo</label><input id="mDeadline" type="date" value="${esc(m.deadline)}" ${editable?'':'disabled'}></div></div><div class="field" style="margin-top:12px"><label>Conclusão</label><textarea id="mConclusion" ${editable?'':'disabled'}>${esc(m.conclusion||'')}</textarea></div>${editable?`<div class="toolbar" style="margin-top:10px"><button class="btn" onclick="saveMilestone('${pid}','${mid}')">Salvar marco</button></div>`:''}<div class="section"><div class="section-head"><div><h2>Memorandos</h2><p>Registro da evolução deste marco.</p></div></div>${(m.memos||[]).map(x=>`<div class="memo"><b>${esc(x.author||'Registro')}</b><p>${esc(x.text||x)}</p><small>${fmtDateTime(x.at)}</small></div>`).join('')||'<div class="empty">Nenhum memorando.</div>'}${editable?`<div class="field" style="margin-top:10px"><textarea id="mMemo" placeholder="Registrar evolução, decisão ou contexto..."></textarea></div><button class="btn light" onclick="addMilestoneMemo('${pid}','${mid}')">Adicionar memorando</button>`:''}</div><div class="section"><div class="section-head"><div><h2>Arquivos</h2><p>Evidências e entregáveis.</p></div></div>${fileList(m.files||[])}${editable?`<input id="mFile" type="file" style="margin-top:10px"><button class="btn light" style="margin-top:8px" onclick="uploadFile('${pid}','${mid}','mFile')">Enviar arquivo</button>`:''}</div></div>`)}
function saveMilestone(pid,mid){let p=pById(pid),m=p.milestones.find(x=>x.id===mid);m.status=$('#mStatus').value;m.deadline=$('#mDeadline').value;m.conclusion=$('#mConclusion').value.trim();m.concludedAt=m.status==='Concluído'?(m.concludedAt||new Date().toISOString()):'';p.lastUpdate=new Date().toISOString();p.history=p.history||[];p.history.push({at:new Date().toISOString(),actor:USER.display_name,action:'Marco atualizado',detail:m.name+' · '+m.status});saveState(()=>{closeModal();render();toast('Marco atualizado')})}function addMilestoneMemo(pid,mid){let t=$('#mMemo').value.trim();if(!t)return;let p=pById(pid),m=p.milestones.find(x=>x.id===mid);m.memos=m.memos||[];m.memos.push({at:new Date().toISOString(),author:USER.display_name,text:t});p.lastUpdate=new Date().toISOString();saveState(()=>openMilestone(pid,mid))}
function renderCommitments(p,editable){let c=p.weeklyCommitments||[];return`<div class="section-head"><div><h2>Compromissos da semana</h2><p>Resultados estratégicos, não microtarefas.</p></div></div>${c.length?c.map(x=>`<div class="commit"><div class="grow"><b>${esc(x.text||x)}</b><div class="tiny muted">${fmtDateTime(x.createdAt)}</div></div>${pill(x.status||'Pendente')}${editable?`<button class="btn red small" onclick="removeCommitment('${p.id}','${x.id}')">Remover</button>`:''}</div>`).join(''):'<div class="empty">Nenhum compromisso para o ciclo atual.</div>'}${editable?`<div class="form-row" style="margin-top:12px"><div class="field"><label>Novo compromisso</label><input id="newCommit" placeholder="Resultado esperado até a próxima reunião"></div><div style="display:flex;align-items:flex-end"><button class="btn" onclick="addCommitment('${p.id}')">Adicionar</button></div></div>`:''}`}function addCommitment(pid){let t=$('#newCommit').value.trim();if(!t)return;let p=pById(pid);p.weeklyCommitments=p.weeklyCommitments||[];p.weeklyCommitments.push({id:Date.now().toString(36),text:t,status:'Pendente',createdAt:new Date().toISOString()});saveState(()=>render())}function removeCommitment(pid,id){let p=pById(pid);p.weeklyCommitments=(p.weeklyCommitments||[]).filter(x=>String(x.id)!==String(id));saveState(()=>render())}
function renderFiles(p,editable){return`<div class="section-head"><div><h2>Arquivos do projeto</h2><p>Documentos, evidências e entregáveis gerais.</p></div></div>${fileList(p.files||[])}${editable?`<div class="field" style="margin-top:12px"><label>Enviar arquivo</label><input id="pFile" type="file"></div><button class="btn" style="margin-top:8px" onclick="uploadFile('${p.id}','','pFile')">Enviar arquivo</button>`:''}`}function fileList(files){return files.length?files.map(f=>`<div class="file"><div><b>${esc(f.name)}</b><div class="tiny muted">${esc(f.note||'')} ${f.date?'· '+esc(f.date):''}</div></div><a class="link" href="${esc(f.url)}">Baixar</a></div>`).join(''):'<div class="empty">Nenhum arquivo.</div>'}async function uploadFile(pid,mid,inputId){let inp=$('#'+inputId);if(!inp||!inp.files[0])return toast('Selecione um arquivo');let fd=new FormData();fd.append('file',inp.files[0]);fd.append('project_id',pid);if(mid)fd.append('milestone_id',mid);setSave('Enviando arquivo…');let r=await fetch('/api/attachments',{method:'POST',headers:{'X-CSRF-Token':CSRF},body:fd});if(!r.ok){setSave('Erro');return toast('Falha no upload')}let f=await r.json(),p=pById(pid);if(mid){let m=p.milestones.find(x=>x.id===mid);m.files=m.files||[];m.files.push(f)}else{p.files=p.files||[];p.files.push(f)}saveState(()=>{if(mid)openMilestone(pid,mid);else render();toast('Arquivo enviado')})}
function renderProjectHistory(p){let h=(p.history||[]).slice().reverse();return`<div class="section-head"><div><h2>Histórico do projeto</h2><p>Eventos registrados ao longo da transformação.</p></div></div>${h.length?`<div class="history">${h.map(x=>`<div class="hist"><b>${esc(x.action)}</b><p>${esc(x.detail||'')}</p><small>${esc(x.actor||'')} · ${fmtDateTime(x.at)}</small></div>`).join('')}</div>`:'<div class="empty">Ainda não há eventos registrados.</div>'}`}
function dependencyTable(deps){if(!deps.length)return'<div class="empty">Nenhuma pendência externa.</div>';return`<div class="table-wrap"><table class="table"><thead><tr><th>Projeto</th><th>Solicitante</th><th>Assunto</th><th>Diretor</th><th>Prazo</th><th>Status</th></tr></thead><tbody>${deps.map(d=>{let p=pById(d.projectId);return`<tr class="click" onclick="openDependency('${d.id}')"><td>${esc(p?.name||d.projectId)}</td><td>${esc(d.requester||'')}</td><td><b>${esc(d.subject)}</b></td><td>${esc(d.director)}</td><td>${fmtDate(d.deadline)}</td><td>${pill(d.status)}</td></tr>`}).join('')}</tbody></table></div>`}
function renderDependencies(){let deps=(state.dependencies||[]).slice();if(!USER.is_director)deps=deps.filter(d=>d.projectId===USER.project_id);let counts={open:deps.filter(d=>d.status==='Aberta').length,analysis:deps.filter(d=>d.status==='Em análise').length,answered:deps.filter(d=>d.status==='Respondida').length,resolved:deps.filter(d=>d.status==='Resolvida').length};return`<div class="hero"><div><h1>${USER.is_director?'Pendências da Diretoria':'Pendências externas'}</h1><p>${USER.is_director?'Visão consolidada de todas as solicitações. Um diretor responsável, trabalho coletivo da Diretoria.':'Solicitações do seu projeto para a Diretoria.'}</p></div>${!USER.is_director&&canEdit(USER.project_id)?`<button class="btn" onclick="newDependency('${USER.project_id}')">＋ Nova pendência</button>`:''}</div><div class="grid g4"><div class="card metric"><span>Aberta</span><b>${counts.open}</b></div><div class="card metric"><span>Em análise</span><b>${counts.analysis}</b></div><div class="card metric"><span>Respondida</span><b>${counts.answered}</b></div><div class="card metric"><span>Resolvida</span><b>${counts.resolved}</b></div></div><div class="section card panel">${dependencyTable(deps)}</div>`}
function newDependency(pid){let p=pById(pid);showModal(`<div class="modal-head"><div><div class="tiny muted">${esc(p.name)}</div><h2>Nova pendência externa</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="notice">Use uma pendência externa somente quando o avanço do projeto depender de uma decisão ou ação da Diretoria.</div><div class="field" style="margin-top:14px"><label>Assunto</label><input id="dSubject" placeholder="Ex.: Definir política de desconto"></div><div class="field" style="margin-top:10px"><label>Descrição</label><textarea id="dDescription" placeholder="O que você precisa da Diretoria?"></textarea></div><div class="form-row" style="margin-top:10px"><div class="field"><label>Diretor responsável</label><select id="dDirector"><option value="">Selecione</option>${DIRECTORS.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>Prazo</label><input id="dDeadline" type="date"></div></div><button class="btn" style="margin-top:14px" onclick="submitDependency('${pid}')">Abrir pendência</button></div>`)}async function submitDependency(pid){let body={projectId:pid,subject:$('#dSubject').value.trim(),description:$('#dDescription').value.trim(),director:$('#dDirector').value,deadline:$('#dDeadline').value};if(!body.subject||!body.director)return toast('Preencha assunto e diretor responsável');setSave('Salvando…');let r=await fetch('/api/dependencies',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':CSRF},body:JSON.stringify(body)});let j=await r.json();if(!r.ok){setSave('Erro');return toast('Não foi possível abrir a pendência')}state.dependencies.push(j.dependency);revision=j.revision;setSave('Sincronizado');closeModal();render();toast('Pendência aberta')}
function openDependency(id){let d=dById(id),p=pById(d.projectId),own=isOwner(d.projectId),director=USER.is_director,canClose=own||director;showModal(`<div class="modal-head"><div><div class="tiny muted">${esc(p?.name||'Projeto')} · Pendência externa</div><h2>${esc(d.subject)}</h2><div style="margin-top:7px">${pill(d.status)}</div></div><button class="close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="dep-summary"><div><span>Solicitante</span><b>${esc(d.requester)}</b></div><div><span>Diretor responsável</span><b>${esc(d.director)}</b></div><div><span>Prazo</span><b>${fmtDate(d.deadline)}</b></div><div><span>Status</span><b>${esc(d.status)}</b></div></div><div class="field"><label>Descrição</label><div class="callout">${esc(d.description||'—')}</div></div>${director?`<div class="section"><div class="section-head"><div><h2>Diretoria</h2><p>Todos os diretores podem responder; permanece um responsável formal.</p></div></div><div class="actionbar">${d.status!=='Resolvida'&&USER.display_name===d.director?`<button class="btn light" onclick="depAction('${d.id}','assume')">Assumir</button>`:''}<select id="directorChange" style="border:1px solid #d9e1ea;border-radius:8px;padding:7px">${DIRECTORS.map(x=>`<option ${x===d.director?'selected':''}>${esc(x)}</option>`).join('')}</select><button class="btn outline" onclick="changeDirector('${d.id}')">Redirecionar</button></div>${d.status!=='Resolvida'?`<div class="field"><label>Resposta da Diretoria</label><textarea id="depResponse" placeholder="Registrar a resposta que ficará visível ao solicitante..."></textarea></div><button class="btn" style="margin-top:8px" onclick="depTextAction('${d.id}','respond','depResponse')">Responder</button>`:''}</div>`:''}<div class="section"><div class="section-head"><div><h2>Histórico</h2><p>Linha do tempo imutável da pendência.</p></div></div><div class="history">${(d.history||[]).slice().reverse().map(h=>`<div class="hist"><b>${esc(h.action)}</b><p>${esc(h.detail||'')}</p><small>${esc(h.actor)} · ${fmtDateTime(h.at)}</small></div>`).join('')}</div></div>${(own||director)?`<div class="section"><div class="field"><label>Adicionar informação / comentário</label><textarea id="depComment"></textarea></div><button class="btn light" style="margin-top:8px" onclick="depTextAction('${d.id}','comment','depComment')">Adicionar</button></div>`:''}${canClose?`<div class="section"><div class="section-head"><div><h2>Encerramento</h2></div></div>${d.status==='Resolvida'?`<div class="field"><label>Motivo obrigatório da reabertura</label><textarea id="reopenReason"></textarea></div><button class="btn light" style="margin-top:8px" onclick="depTextAction('${d.id}','reopen','reopenReason')">Reabrir pendência</button>`:`<div class="field"><label>Conclusão da resolução (opcional)</label><textarea id="resolveText"></textarea></div><button class="btn green" style="margin-top:8px" onclick="depTextAction('${d.id}','resolve','resolveText')">Marcar como resolvida</button>`}</div>`:''}</div>`,true)}async function depAction(id,action,extra={}){setSave('Salvando…');let r=await fetch(`/api/dependencies/${id}/action`,{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':CSRF},body:JSON.stringify({action,...extra})});let j=await r.json();if(!r.ok){setSave('Erro');return toast(j.error==='reason_required'?'Informe o motivo da reabertura':'Ação não permitida')}let idx=state.dependencies.findIndex(x=>String(x.id)===String(id));state.dependencies[idx]=j.dependency;revision=j.revision;setSave('Sincronizado');openDependency(id);toast('Pendência atualizada')}function depTextAction(id,action,input){let text=$('#'+input)?.value.trim()||'';if(['respond','comment','reopen'].includes(action)&&!text)return toast('Escreva o texto antes de continuar');depAction(id,action,{text})}function changeDirector(id){depAction(id,'change_director',{director:$('#directorChange').value})}
function renderMeetingSelector(){let editable=state.projects.filter(p=>canEdit(p.id));return`<div class="hero"><div><h1>Modo Reunião</h1><p>Ciclo semanal: retrospectiva, decisões e próximos compromissos.</p></div></div><div class="card panel"><div class="section-head"><div><h2>Escolha o projeto</h2><p>Você pode conduzir reunião apenas nos projetos que pode alterar.</p></div></div>${editable.map(p=>{let s=projectStats(p);return`<div class="milestone" onclick="startMeeting('${p.id}')"><div class="num">▶</div><div><b>${esc(p.name)}</b><small>${esc(p.owner)} · ${s.done}/${s.total} marcos</small></div>${pill(p.status)}<div>›</div></div>`}).join('')}</div>`}function startMeeting(pid){let p=pById(pid);meetingDraft={projectId:pid,previous:(p.weeklyCommitments||[]).map(x=>({...x,result:x.result||x.status||'Pendente',comment:''})),notes:'',decisions:'',nextText:''};meetingStep=1;renderMeeting()}function renderMeeting(){currentView='meeting';syncNav();let p=pById(meetingDraft.projectId),s=projectStats(p);$('#content').innerHTML=`<div class="meeting"><div class="hero"><div><h1>Modo Reunião · ${esc(p.name)}</h1><p>Responsável: ${esc(p.owner)}</p></div><button class="btn light" onclick="meetingDraft=null;render()">Sair da reunião</button></div><div class="steps">${['Resumo do projeto','Semana anterior','Andamento e decisões','Próxima semana'].map((x,i)=>`<div class="step ${meetingStep===i+1?'active':''}">${i+1}. ${x}</div>`).join('')}</div><div class="card meeting-card">${meetingPage(p,s)}</div></div>`}function meetingPage(p,s){if(meetingStep===1)return`<h2>Resumo do projeto</h2><p>Visão informativa para abrir a reunião.</p><div class="grid g3"><div class="card metric"><span>Status</span><b style="font-size:16px">${esc(p.status)}</b></div><div class="card metric"><span>Marcos</span><b>${s.done}/${s.total}</b></div><div class="card metric"><span>Pendências abertas</span><b>${openDepsFor(p.id).length}</b></div></div><div class="section callout objective"><b>Objetivo</b><br><br>${esc(p.objective)}</div>${meetingNav()}`;if(meetingStep===2)return`<h2>Pendências e compromissos da semana anterior</h2><p>Registre o resultado do que havia sido combinado.</p>${meetingDraft.previous.length?meetingDraft.previous.map((x,i)=>`<div class="result-row"><div><b>${esc(x.text||x)}</b><div class="field" style="margin-top:6px"><input placeholder="O que aconteceu?" value="${esc(x.comment||'')}" onchange="meetingDraft.previous[${i}].comment=this.value"></div></div><select onchange="meetingDraft.previous[${i}].result=this.value"><option ${x.result==='Realizado'?'selected':''}>Realizado</option><option ${x.result==='Parcial'?'selected':''}>Parcial</option><option ${x.result==='Não realizado'?'selected':''}>Não realizado</option></select></div>`).join(''):'<div class="empty">Primeiro ciclo: não há compromissos anteriores.</div>'}${meetingNav()}`;if(meetingStep===3)return`<h2>Andamento da reunião e decisões tomadas</h2><p>O principal registro vivo da conversa.</p><div class="field"><label>Andamento / análise</label><textarea onchange="meetingDraft.notes=this.value">${esc(meetingDraft.notes)}</textarea></div><div class="field" style="margin-top:12px"><label>Decisões tomadas</label><textarea onchange="meetingDraft.decisions=this.value">${esc(meetingDraft.decisions)}</textarea></div>${meetingNav()}`;return`<h2>Próxima semana</h2><p>Defina resultados estratégicos até a próxima reunião. Uma linha por compromisso.</p><div class="field"><label>Compromissos</label><textarea style="min-height:150px" placeholder="Ex.: Fechar desenho das carteiras\nValidar nova rotina comercial" onchange="meetingDraft.nextText=this.value">${esc(meetingDraft.nextText)}</textarea></div><div class="notice" style="margin-top:12px">Pendências externas são abertas separadamente para preservar o diretor responsável, prazo e histórico.</div>${meetingNav(true)}`}function meetingNav(last=false){return`<div class="meeting-nav"><button class="btn light" ${meetingStep===1?'disabled':''} onclick="meetingStep--;renderMeeting()">← Anterior</button>${last?`<button class="btn" onclick="closeMeeting()">Concluir reunião</button>`:`<button class="btn" onclick="meetingStep++;renderMeeting()">Próxima →</button>`}</div>`}function closeMeeting(){let p=pById(meetingDraft.projectId),next=meetingDraft.nextText.split('\n').map(x=>x.trim()).filter(Boolean).map((text,i)=>({id:Date.now().toString(36)+'-'+i,text,status:'Pendente',createdAt:new Date().toISOString()}));let rec={id:Date.now().toString(36),projectId:p.id,createdAt:new Date().toISOString(),createdBy:USER.display_name,previousCommitments:meetingDraft.previous,notes:meetingDraft.notes,decisions:meetingDraft.decisions,nextCommitments:next};state.meetings=state.meetings||[];state.meetings.push(rec);p.weeklyCommitments=next;p.lastUpdate=rec.createdAt;p.history=p.history||[];p.history.push({at:rec.createdAt,actor:USER.display_name,action:'Reunião concluída',detail:`${next.length} compromisso(s) para o próximo ciclo`});saveState(()=>{meetingDraft=null;openProject(p.id);toast('Reunião registrada')})}
async function saveState(cb){setSave('Salvando…');try{let r=await fetch('/api/state',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':CSRF},body:JSON.stringify({state,revision})});let j=await r.json();if(r.status===409){setSave('Conflito — recarregue');toast('Outra pessoa atualizou o sistema. Recarregue antes de continuar.');return}if(!r.ok)throw new Error(j.error||'save');revision=j.revision;setSave('Sincronizado');cb&&cb()}catch(e){setSave('Erro ao salvar');toast('Não foi possível salvar a alteração')}}function showModal(html,wide=false){$('#modalRoot').innerHTML=`<div class="modal-wrap" onclick="if(event.target===this)closeModal()"><div class="modal ${wide?'wide':''}">${html}</div></div>`}function closeModal(){$('#modalRoot').innerHTML=''}$('#avatar').textContent=initials(USER.display_name);$('#userName').textContent=USER.display_name;$('#userRole').textContent=USER.is_director?'Diretoria':(pById(USER.project_id)?.name||'Responsável');renderNav();render();
</script></body></html>
