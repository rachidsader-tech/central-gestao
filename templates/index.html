<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Transformação KAZ</title>
<link rel="stylesheet" href="/static/kaz.css?v=5">
</head>
<body>

<div class="app">
<aside class="side">
  <div class="brand">KAZ<small>TRANSFORMAÇÃO</small></div>

  <div class="nav-section">Gestão</div>
  <button class="nav-btn active" data-nav="home" onclick="showView('home')">⌂ Início</button>
  <button class="nav-btn" data-nav="projects" onclick="showView('projects')">▣ Todos os projetos</button>
  <button class="nav-btn" data-nav="myproject" id="myProjectNav" onclick="openMyProject()">◎ Meu projeto</button>
  <button class="nav-btn" data-nav="dependencies" onclick="showView('dependencies')">! Pendências</button>
  <button class="nav-btn directionOnly" data-nav="director" onclick="showView('director')">☷ Pendências da Diretoria</button>
  <button class="nav-btn" data-nav="meeting" onclick="showView('meeting')">◫ Modo Reunião</button>

  <div class="nav-section">Conta</div>
  <button class="nav-btn" data-nav="settings" onclick="showView('settings')">⚙ Configurações</button>

  <div class="nav-section">Ajuda</div>
  <button class="nav-btn" data-nav="help" onclick="showView('help')">? Ajuda e tutorial</button>
  <a class="nav-btn sub" href="/manual" download>⇩ Baixar manual</a>

  <div class="nav-section adminOnly">Administração</div>
  <a class="nav-btn adminOnly" href="/admin/users">♙ Usuários</a>

  <div class="nav-spacer"></div>
  <a class="nav-btn" href="/logout">↪ Sair</a>
</aside>

<main class="main">
<header class="top">
  <button class="btn light mobile-menu" onclick="alert('Use o menu lateral em uma tela maior ou recarregue em modo paisagem.')">☰</button>
  <div class="top-title" id="topTitle">Transformação KAZ</div>
  <div class="userbox">
    <div class="avatar" id="avatar"></div>
    <div><b id="userName"></b><small id="userRole"></small></div>
  </div>
</header>

<div class="content">
  <section id="homeView" class="view"></section>
  <section id="projectsView" class="view hidden"></section>
  <section id="projectView" class="view hidden"></section>
  <section id="dependenciesView" class="view hidden"></section>
  <section id="directorView" class="view hidden"></section>
  <section id="meetingView" class="view hidden"></section>
  <section id="helpView" class="view hidden"></section>
  <section id="settingsView" class="view hidden"></section>
</div>
<div class="footer-note">Transformação KAZ · Pessoas · Processos · Resultados</div>
</main>
</div>
<div id="modalRoot"></div>


<script>
window.KAZ_BOOT={
  initial_state: {{ initial_state|tojson }},
  user: {{ user|tojson }},
  csrf: {{ csrf|tojson }},
  directors: {{ directors|tojson }}
};
</script>
<script src="/static/kaz1.js?v=5"></script>
<script src="/static/kaz2.js?v=5"></script>
<script src="/static/kaz3.js?v=5"></script>
<script src="/static/kaz4.js?v=5"></script>
</body>
</html>
