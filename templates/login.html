<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Central de Gestão — Login</title><style>body{margin:0;font-family:Inter,Arial,sans-serif;background:#f5f6f8;display:grid;place-items:center;min-height:100vh;color:#111827}.card{width:min(420px,calc(100% - 32px));background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:26px}.card h1{margin:0 0 5px}.card p{color:#6b7280;font-size:13px}.card input{width:100%;box-sizing:border-box;border:1px solid #d1d5db;border-radius:9px;padding:11px 12px;margin-top:9px}.card button{width:100%;border:0;border-radius:9px;padding:11px 12px;background:#111827;color:#fff;margin-top:12px;cursor:pointer}.err{color:#991b1b;font-size:12px;margin-top:10px}</style></head><body><form class="card" method="post"><h1>Central de Gestão</h1><p>Acesse seu sistema de gestão.</p><input type="email" name="email" placeholder="E-mail" required><input type="password" name="password" placeholder="Senha" required><button type="submit">Entrar</button>{% if error %}<div class="err">{{ error }}</div>{% endif %}</form></body></html>
