<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transformação KAZ</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fa;color:#0f172a;min-height:100vh;display:grid;place-items:center}.wrap{width:min(430px,92vw)}.brand{text-align:center;margin-bottom:28px}.brand h1{font-size:48px;letter-spacing:-2px;margin:0;font-weight:850}.brand p{margin:2px 0 0;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#475569}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:30px;box-shadow:0 18px 45px rgba(15,23,42,.06)}h2{font-size:18px;margin:0 0 22px}.field{margin-bottom:14px}.field label{font-size:11px;color:#64748b;display:block;margin:0 0 6px}.field input{width:100%;padding:12px 13px;border:1px solid #cbd5e1;border-radius:10px;font:inherit;outline:none}.field input:focus{border-color:#0f172a}.btn{width:100%;border:0;background:#172033;color:#fff;padding:12px;border-radius:10px;font-weight:700;cursor:pointer;margin-top:4px}.error{background:#fef2f2;color:#991b1b;border:1px solid #fecaca;padding:10px 12px;border-radius:9px;font-size:12px;margin-bottom:14px}.foot{text-align:center;color:#94a3b8;font-size:10px;letter-spacing:1.6px;text-transform:uppercase;margin-top:24px}</style></head><body><div class="wrap"><div class="brand"><h1>KAZ</h1><p>Transformação</p></div><div class="card"><h2>Acesse sua conta</h2>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="post"><div class="field"><label>Usuário</label><input name="username" autocomplete="username" required autofocus></div><div class="field"><label>Senha</label><input name="password" type="password" autocomplete="current-password" required></div><button class="btn">Entrar</button></form></div><div class="foot">Pessoas · Processos · Resultados</div></div></body></html>
