<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Transformação KAZ — Login</title>
<style>
body{margin:0;background:#0d0d0f;color:#f6f6f7;font-family:Inter,Segoe UI,Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.box{width:min(420px,calc(100% - 32px));background:#17171b;border:1px solid #303039;border-radius:18px;padding:28px;box-sizing:border-box}.brand{font-size:30px;font-weight:900}.brand span{color:#f5348a}.sub{color:#a8a8b2;margin:4px 0 24px}.input{width:100%;box-sizing:border-box;background:#101014;color:#fff;border:1px solid #303039;border-radius:10px;padding:12px;margin:6px 0 14px;font:inherit}.btn{width:100%;background:#f5348a;color:#fff;border:0;border-radius:10px;padding:12px;font-weight:800;font:inherit;cursor:pointer}.err{background:#2a1416;border:1px solid #6a2b31;color:#ffb1b6;padding:10px;border-radius:10px;margin-bottom:14px}
</style></head><body><form class="box" method="post"><div class="brand">KAZ<span>.</span></div><div class="sub">TRANSFORMAÇÃO • ACESSO</div>{% if error %}<div class="err">{{ error }}</div>{% endif %}<label>Usuário</label><input class="input" name="username" autocomplete="username" required><label>Senha</label><input class="input" name="password" type="password" autocomplete="current-password" required><button class="btn">Entrar</button></form></body></html>
