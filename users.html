<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Usuários — Transformação KAZ</title><style>
body{margin:0;background:#0d0d0f;color:#f6f6f7;font-family:Inter,Segoe UI,Arial,sans-serif}.wrap{max-width:1200px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.btn{background:#202026;border:1px solid #303039;color:#fff;border-radius:10px;padding:9px 12px;text-decoration:none;cursor:pointer}.card{background:#17171b;border:1px solid #303039;border-radius:16px;padding:16px;margin:12px 0;display:grid;grid-template-columns:1.2fr .8fr .8fr .8fr 1fr auto;gap:10px;align-items:end}.input,select{width:100%;box-sizing:border-box;background:#101014;color:#fff;border:1px solid #303039;border-radius:9px;padding:9px}.small{font-size:11px;color:#a8a8b2}.ok{background:#153021;color:#a8e6be;padding:10px;border-radius:9px}.err{background:#321719;color:#ffb1b6;padding:10px;border-radius:9px}@media(max-width:900px){.card{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><div class="top"><div><h1>Usuários</h1><div class="small">Ative os participantes e defina uma senha inicial.</div></div><a class="btn" href="/">← Voltar</a></div>{% if message %}<div class="ok">{{ message }}</div>{% endif %}{% if error %}<div class="err">{{ error }}</div>{% endif %}{% for u in users %}<form class="card" method="post"><input type="hidden" name="csrf_token" value="{{ csrf }}"><input type="hidden" name="user_id" value="{{ u.id }}"><div><div class="small">NOME</div><input class="input" name="display_name" value="{{ u.display_name }}"><div class="small" style="margin-top:4px">login: {{ u.username }}</div></div><div><div class="small">PERFIL</div><select name="role"><option value="owner" {% if u.role=='owner' %}selected{% endif %}>Dono</option><option value="direction" {% if u.role=='direction' %}selected{% endif %}>Direção</option><option value="admin" {% if u.role=='admin' %}selected{% endif %}>Admin</option></select></div><div><div class="small">PROJETO</div><select name="project_id"><option value="">—</option>{% for pid,pname in projects %}<option value="{{ pid }}" {% if u.project_id==pid %}selected{% endif %}>{{ pname }}</option>{% endfor %}</select></div><div><div class="small">ATIVO</div><label><input type="checkbox" name="active" {% if u.active %}checked{% endif %}> Pode entrar</label></div><div><div class="small">NOVA SENHA</div><input class="input" type="password" name="password" placeholder="Deixe vazio para manter"></div><button class="btn">Salvar</button></form>{% endfor %}</div></body></html>
