<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transformação KAZ</title>
<style>
:root {
 --bg:#0d0d0f; --panel:#17171b; --panel2:#202026; --line:#303039; --text:#f6f6f7;
 --muted:#a8a8b2; --accent:#f5348a; --good:#34c77b; --warn:#f6b93b; --risk:#ff675f; --blue:#5da9ff;
}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}
button,input,textarea,select{font:inherit} button{cursor:pointer}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.sidebar{border-right:1px solid var(--line);padding:24px 16px;position:sticky;top:0;height:100vh;background:#111114}
.brand{font-weight:900;font-size:26px;letter-spacing:-1px;margin-bottom:4px} .brand span{color:var(--accent)}
.sub{color:var(--muted);font-size:12px;margin-bottom:28px}
.nav button{width:100%;text-align:left;background:transparent;color:var(--muted);border:0;border-radius:10px;padding:11px 12px;margin:2px 0}
.nav button.active,.nav button:hover{background:var(--panel2);color:#fff}
.main{padding:26px 30px 60px;max-width:1500px;width:100%;margin:0 auto}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}
h1{font-size:28px;margin:0} h2{margin:0 0 12px} h3{margin:0 0 10px} .muted{color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);padding:5px 9px;border-radius:999px;font-size:12px;color:var(--muted)}
.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:700}
.btn.secondary{background:var(--panel2);border:1px solid var(--line);color:#fff} .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:17px}
.kpi .num{font-size:28px;font-weight:850;margin-top:6px}
.project-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px}
.project-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;transition:.15s}
.project-card:hover{transform:translateY(-1px);border-color:#51515d}
.project-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.owner{color:var(--muted);font-size:13px} .progress{height:8px;background:#29292f;border-radius:999px;overflow:hidden;margin:15px 0 8px}
.progress>span{display:block;height:100%;background:var(--accent)}
.meta-row{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.status-dot{width:8px;height:8px;border-radius:99px;display:inline-block;margin-right:5px} .s-not{background:#777} .s-progress{background:var(--warn)} .s-risk{background:var(--risk)} .s-done{background:var(--good)}
.table{width:100%;border-collapse:collapse} .table th,.table td{border-bottom:1px solid var(--line);padding:12px 8px;text-align:left;vertical-align:top} .table th{color:var(--muted);font-size:12px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0} .tabs button{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:8px 12px} .tabs button.active{color:#fff;border-color:var(--accent)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0}
.milestone{border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0;background:#141418}
.milestone-top{display:grid;grid-template-columns:1fr 170px 150px auto;gap:10px;align-items:center}
.milestone-title{font-weight:750} .small{font-size:12px;color:var(--muted)}
.input,.select,.textarea{width:100%;background:#101014;color:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 11px}
.textarea{min-height:90px;resize:vertical}
.timeline{border-left:2px solid var(--line);margin-left:8px;padding-left:18px} .timeline-item{margin:0 0 16px} .timeline-item .date{font-size:11px;color:var(--muted)}
.file-row{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px;margin:7px 0}
.split{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}
.meeting-step{display:none} .meeting-step.active{display:block}
.stepper{display:flex;gap:6px;overflow:auto;padding-bottom:8px} .step{white-space:nowrap;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 10px;color:var(--muted);font-size:12px} .step.active{border-color:var(--accent);color:#fff}
.commitment{display:grid;grid-template-columns:1fr 180px;gap:10px;margin:8px 0}
.notice{border-left:3px solid var(--accent);background:#1c1419;padding:12px 14px;border-radius:8px;color:#e9c9d7}
.project-hero{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:start;margin-bottom:14px}
.meeting-cta{padding:13px 20px;font-size:15px;box-shadow:0 0 0 1px rgba(245,52,138,.15),0 8px 28px rgba(245,52,138,.16)}
.meeting-shell{max-width:1180px;margin:0 auto}
.meeting-header{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;padding:6px 0 18px;border-bottom:1px solid var(--line)}
.meeting-title{font-size:34px;letter-spacing:-1px;margin:3px 0}
.meeting-owner{color:var(--muted);font-size:14px}
.meeting-stage{margin-top:18px;background:linear-gradient(180deg,#17171b,#131317);border:1px solid var(--line);border-radius:20px;padding:24px}
.meeting-stage h2{font-size:25px;letter-spacing:-.5px}
.meeting-stepper{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin:18px 0 0}
.meeting-step-pill{border:1px solid var(--line);background:#141418;border-radius:12px;padding:9px 10px;color:var(--muted);font-size:11px;min-height:45px}
.meeting-step-pill.active{border-color:var(--accent);background:#22151c;color:#fff}
.meeting-step-pill.done{border-color:#3b5b49;color:#bfe8cf}
.meeting-controls{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px;position:sticky;bottom:12px;background:rgba(13,13,15,.92);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:14px;padding:10px 12px;z-index:4}
.meeting-big-btn{padding:12px 22px;font-weight:850}
.meeting-status-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:15px 0}
.meeting-status-card{border:1px solid var(--line);background:#111115;border-radius:14px;padding:14px}
.meeting-status-card .n{font-size:25px;font-weight:850;margin-top:5px}
.meeting-commitment-card{border:1px solid var(--line);border-radius:15px;padding:16px;margin:10px 0;background:#111115}
.meeting-commitment-title{font-size:17px;font-weight:800;margin-bottom:12px}
.meeting-two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.meeting-mark-row{display:grid;grid-template-columns:38px 1fr 155px 150px;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.meeting-mark-row:last-child{border-bottom:0}
.meeting-summary{background:#111115;border:1px solid var(--line);border-radius:14px;padding:16px}
.meeting-note{font-size:13px;color:var(--muted);line-height:1.45}
.meeting-closed{max-width:900px;margin:70px auto;text-align:center}
.meeting-closed .check{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;background:#173425;color:#82e2aa;font-size:30px}
.last-meeting-strip{display:grid;grid-template-columns:1.2fr .8fr .8fr;gap:10px;margin-top:12px}
.last-meeting-box{border:1px solid var(--line);border-radius:12px;background:#121216;padding:12px}
.last-meeting-box .label{font-size:11px;color:var(--muted);text-transform:uppercase}
.last-meeting-box .value{margin-top:5px;font-weight:750;line-height:1.35}
.history-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;margin:12px 0;overflow:hidden}
.history-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:16px 18px;border-bottom:1px solid var(--line)}
.history-body{padding:18px}
.history-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.history-section{border:1px solid var(--line);border-radius:12px;padding:13px;background:#121216}
.history-section h4{margin:0 0 8px;font-size:13px;color:var(--muted);text-transform:uppercase}
.result-ok{color:#7fe0a5}.result-partial{color:#f5bf55}.result-no{color:#ff7a72}
@media(max-width:900px){.last-meeting-strip,.history-grid{grid-template-columns:1fr}}

@media(max-width:980px){.meeting-stepper{grid-template-columns:1fr 1fr}.meeting-two{grid-template-columns:1fr}.meeting-mark-row{grid-template-columns:34px 1fr}.meeting-header{grid-template-columns:1fr}.meeting-status-grid{grid-template-columns:repeat(2,1fr)}}

.executive-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:14px 0}
.executive-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.executive-box .value{font-size:22px;font-weight:850;margin-top:5px}
.roadmap-row{display:grid;grid-template-columns:42px 1fr 145px 130px;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.roadmap-row:last-child{border-bottom:0}
.roadmap-click{cursor:pointer;border-radius:10px;padding-left:6px;padding-right:6px;transition:.15s}
.roadmap-click:hover{background:#1b1b20}
.roadmap-detail{display:none;background:#111115;border:1px solid var(--line);border-radius:12px;padding:14px;margin:8px 0 12px}
.roadmap-detail.open{display:block}
.roadmap-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.roadmap-detail-section{border:1px solid var(--line);border-radius:10px;padding:12px;background:#141418}
.roadmap-detail-section h4{margin:0 0 8px;font-size:12px;color:var(--muted);text-transform:uppercase}
@media(max-width:800px){.roadmap-detail-grid{grid-template-columns:1fr}}

.roadmap-index{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--panel2);font-weight:800;color:var(--muted)}
.recent-list .item{padding:11px 0;border-bottom:1px solid var(--line)}
.recent-list .item:last-child{border-bottom:0}
@media(max-width:980px){.project-hero{grid-template-columns:1fr}.executive-grid{grid-template-columns:repeat(2,1fr)}.roadmap-row{grid-template-columns:36px 1fr}}
@media(max-width:600px){.executive-grid{grid-template-columns:1fr}}
.hr{height:1px;background:var(--line);margin:18px 0}
.right{text-align:right} .hidden{display:none!important}
@media(max-width:980px){.shell{grid-template-columns:1fr}.sidebar{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}.nav{display:flex;overflow:auto}.nav button{width:auto;white-space:nowrap}.cards{grid-template-columns:repeat(2,1fr)}.project-grid,.split{grid-template-columns:1fr}.milestone-top{grid-template-columns:1fr}}
@media(max-width:600px){.main{padding:18px 14px 40px}.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">
<aside class="sidebar">
  <div class="brand">KAZ<span>.</span></div>
  <div class="sub">TRANSFORMAÇÃO • SISTEMA</div>
  <div class="nav">
    <button data-view="dashboard" class="active">Visão Geral</button>
    <button data-view="dependencies">Pendências</button>
    <button data-view="history">Histórico</button>
    <button id="exportBackup">Exportar backup</button>

  </div>
  <div style="position:absolute;bottom:18px;left:16px;right:16px;border-top:1px solid var(--line);padding-top:12px">
    <div class="small">Conectado como</div>
    <div style="font-weight:700;margin:3px 0">{{ user.display_name }}</div>
    <div id="saveIndicator" class="small">Salvo</div>
    {% if user.role == 'admin' %}<a href="/admin/users" style="display:block;color:var(--muted);font-size:12px;margin-top:8px">Gerenciar usuários</a>{% endif %}
    <a href="/logout" style="display:block;color:var(--muted);font-size:12px;margin-top:5px">Sair</a>
  </div>
</aside>
<main class="main" id="app"></main>
</div>

<script>
const INITIAL = {{ initial_state|tojson }};
let db = clone(INITIAL);
let serverRevision = {{ revision }};
const CURRENT_USER = {{ user|tojson }};
const CSRF = {{ csrf|tojson }};
let currentProjectId=null;
let currentTab='overview';
let meeting={projectId:null, step:0, draft:null};
let saveRunning=false, saveDirty=false;

function clone(x){return JSON.parse(JSON.stringify(x))}
function load(){ return clone(INITIAL); }
function bootstrap(){ return clone(INITIAL); }

function setSaveIndicator(text, kind=''){
 const el=document.getElementById('saveIndicator');
 if(el){ el.textContent=text; el.style.color=kind==='error'?'#ff7a72':kind==='ok'?'#7fe0a5':''; }
}
function save(){
 saveDirty=true;
 if(saveRunning) return;
 flushSave();
}
async function flushSave(){
 if(!saveDirty || saveRunning) return;
 saveDirty=false; saveRunning=true; setSaveIndicator('Salvando...');
 try{
   const res=await fetch('/api/state',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':CSRF},body:JSON.stringify({state:db,revision:serverRevision})});
   if(res.status===409){
      const data=await res.json();
      setSaveIndicator('Conflito — recarregue', 'error');
      alert('Outra pessoa atualizou o sistema antes de você. Para evitar sobrescrever dados, recarregue a página e refaça esta última alteração.');
      return;
   }
   if(!res.ok) throw new Error('Falha ao salvar');
   const data=await res.json(); serverRevision=data.revision; setSaveIndicator('Salvo', 'ok');
 }catch(e){ setSaveIndicator('Erro ao salvar', 'error'); alert('Não foi possível salvar no servidor. Verifique sua conexão.'); }
 finally{ saveRunning=false; if(saveDirty) flushSave(); }
}
function project(id){return db.projects.find(p=>p.id===id)}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function pct(p){const done=p.milestones.filter(m=>m.status==='Concluído').length; return Math.round(done/p.milestones.length*100)}
function currentMilestone(p){return p.milestones.find(m=>m.status!=='Concluído') || p.milestones[p.milestones.length-1]}

function meetingsForProject(projectId){
 return db.meetings.filter(m=>m.projectId===projectId);
}
function lastMeeting(projectId){
 const list=meetingsForProject(projectId);
 return list.length?list[list.length-1]:null;
}
function resultSummary(rec){
 if(!rec||!rec.previous||!rec.previous.length)return {done:0,partial:0,no:0,total:0};
 let done=0,partial=0,no=0;
 rec.previous.forEach((_,i)=>{
   const st=rec.results&&rec.results[i]?rec.results[i].status:'';
   if(st==='Realizado')done++;
   if(st==='Parcial')partial++;
   if(st==='Não realizado')no++;
 });
 return {done,partial,no,total:rec.previous.length};
}
function meetingPulse(p){
 const rec=lastMeeting(p.id);
 if(!rec)return {label:'Sem reunião fechada',tone:'neutral'};
 const r=resultSummary(rec);
 if(r.no>0 || p.status==='Em risco')return {label:'Atenção',tone:'risk'};
 if(r.partial>0 || db.dependencies.some(d=>d.projectId===p.id&&d.status!=='Resolvida'))return {label:'Em acompanhamento',tone:'warn'};
 return {label:'Evolução saudável',tone:'good'};
}
function statusClass(s){return s==='Concluído'?'s-done':s==='Em risco'?'s-risk':s==='Em andamento'?'s-progress':'s-not'}
function fmtDate(v){if(!v)return '—'; const [y,m,d]=v.split('-'); return `${d}/${m}/${y}`}
function nowBR(){return new Date().toLocaleString('pt-BR')}
function navActive(view){document.querySelectorAll('.nav button[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view))}
function exportBackup(){
 const payload={
   app:'Transformacao KAZ MVP',
   exportedAt:nowBR(),
   data:db
 };
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
 const a=document.createElement('a');
 const dt=new Date();
 const stamp=dt.toISOString().slice(0,19).replace(/[:T]/g,'-');
 a.href=URL.createObjectURL(blob);
 a.download='backup_transformacao_kaz_'+stamp+'.json';
 document.body.appendChild(a);
 a.click();
 setTimeout(()=>URL.revokeObjectURL(a.href),500);
 a.remove();
}
window.exportBackup=exportBackup;


function renderDashboard(){
 navActive('dashboard');
 const total=db.projects.reduce((a,p)=>a+p.milestones.length,0);
 const done=db.projects.reduce((a,p)=>a+p.milestones.filter(m=>m.status==='Concluído').length,0);
 const risk=db.projects.reduce((a,p)=>a+p.milestones.filter(m=>m.status==='Em risco').length,0);
 const deps=db.dependencies.filter(d=>d.status!=='Resolvida').length;
 document.getElementById('app').innerHTML=`
 <div class="topbar"><div><h1>Transformação KAZ</h1><div class="muted">Painel estratégico de implantação</div></div><span class="badge">Direção: ${db.direction.join(' • ')}</span></div>
 <div class="cards">
  <div class="card kpi"><div class="muted">Projetos</div><div class="num">7</div></div>
  <div class="card kpi"><div class="muted">Marcos concluídos</div><div class="num">${done} / ${total}</div></div>
  <div class="card kpi"><div class="muted">Marcos em risco</div><div class="num">${risk}</div></div>
  <div class="card kpi"><div class="muted">Pendências externas</div><div class="num">${deps}</div></div>
 </div>
 <div class="project-grid">
 ${db.projects.map(p=>{
  const m=currentMilestone(p);
  const openDeps=db.dependencies.filter(d=>d.projectId===p.id && d.status!=='Resolvida').length;
  const rec=lastMeeting(p.id);
  const rs=resultSummary(rec);
  const pulse=meetingPulse(p);
  return `<div class="project-card" onclick="openProject('${p.id}')">
    <div class="project-head">
      <div>
        <h3>${esc(p.name)}</h3>
        <div class="owner">Dono: ${esc(p.owner)}</div>
      </div>
      <span class="badge"><span class="status-dot ${statusClass(p.status)}"></span>${esc(p.status)}</span>
    </div>

    <div class="progress"><span style="width:${pct(p)}%"></span></div>
    <div class="small">${p.milestones.filter(m=>m.status==='Concluído').length} de ${p.milestones.length} marcos concluídos</div>

    <div class="last-meeting-strip">
      <div class="last-meeting-box">
        <div class="label">Pulso</div>
        <div class="value">${esc(pulse.label)}</div>
      </div>
      <div class="last-meeting-box">
        <div class="label">Pendências</div>
        <div class="value">${openDeps}</div>
      </div>
      <div class="last-meeting-box">
        <div class="label">Última reunião</div>
        <div class="value">${rec?esc(rec.closedAt):'—'}</div>
      </div>
    </div>

    ${rec&&rs.total?`<div class="small" style="margin-top:10px">Semana anterior: <span class="result-ok">${rs.done} realizado(s)</span> • <span class="result-partial">${rs.partial} parcial(is)</span> • <span class="result-no">${rs.no} não realizado(s)</span></div>`:''}

    <div style="margin-top:12px">
      ${p.validated?'<span class="badge">✓ Validado pelo dono</span>':'<span class="badge">Proposto pela Direção</span>'}
    </div>
  </div>`;
 }).join('')}
 </div>`;
}

function openProject(id){currentProjectId=id; currentTab='overview'; renderProject()}
window.openProject=openProject;

function renderProject(){
 const p=project(currentProjectId); if(!p) return renderDashboard();
 navActive('');
 document.getElementById('app').innerHTML=`
 <div class="topbar"><div><button class="btn ghost" onclick="renderDashboard()">← Visão Geral</button></div></div>

 <div class="project-hero">
   <div>
     <div class="small">PROJETO DE TRANSFORMAÇÃO</div>
     <h1 style="margin-top:4px">${esc(p.name)}</h1>
     <div class="muted">Dono: ${esc(p.owner)}</div>
   </div>
   <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end">
     <select class="select" style="width:170px" onchange="setProjectStatus(this.value)">${['Não iniciado','Em andamento','Em risco','Concluído'].map(s=>`<option ${p.status===s?'selected':''}>${s}</option>`).join('')}</select>
     <button class="btn meeting-cta" onclick="startMeeting('${p.id}')">▶ Iniciar Modo Reunião</button>
   </div>
 </div>

 <div class="panel">
   <div class="small">OBJETIVO DA TRANSFORMAÇÃO</div>
   <div style="font-size:17px;line-height:1.55;margin-top:7px">${esc(p.objective)}</div>
   <div style="margin-top:12px">${p.validated?'<span class="badge">✓ Objetivo e marcos validados pelo dono</span>':'<span class="badge">Proposto pela Direção</span> <button class="btn secondary" style="margin-left:8px" onclick="validateProject()">Validar objetivo e marcos</button>'}</div>
 </div>

 <div class="tabs">
  <button onclick="switchTab('overview')" class="${currentTab==='overview'?'active':''}">Painel do projeto</button>
  <button onclick="switchTab('milestones')" class="${currentTab==='milestones'?'active':''}">Editar marcos</button>
  <button onclick="switchTab('memo')" class="${currentTab==='memo'?'active':''}">Memorando geral</button>
  <button onclick="switchTab('deps')" class="${currentTab==='deps'?'active':''}">Pendências</button>
  <button onclick="switchTab('files')" class="${currentTab==='files'?'active':''}">Arquivos</button>
 </div>
 <div id="projectTab"></div>`;
 renderProjectTab();
}
window.renderDashboard=renderDashboard;

function switchTab(t){currentTab=t; renderProject()} window.switchTab=switchTab;
function setProjectStatus(v){project(currentProjectId).status=v; save(); renderProject()} window.setProjectStatus=setProjectStatus;

   <div><div class="small">MARCO ${i+1}</div><div class="milestone-title">${esc(m.name)}</div></div>
   <select class="select" onchange="updateMilestone('${m.id}','status',this.value)">${['Não iniciado','Em andamento','Em risco','Concluído'].map(s=>`<option ${m.status===s?'selected':''}>${s}</option>`).join('')}</select>
   <input class="input" type="date" value="${m.deadline||''}" onchange="updateMilestone('${m.id}','deadline',this.value)">
   <button class="btn secondary" onclick="toggleMilestone('${m.id}')">Abrir</button>
  </div>
  <div id="detail-${m.id}" class="hidden" style="margin-top:14px">
   <div class="split">
    <div class="panel"><h3>Memorando do marco</h3><textarea id="memo-${m.id}" class="textarea" placeholder="Registre o que ocorreu neste marco..."></textarea><div class="right" style="margin-top:8px"><button class="btn" onclick="addMilestoneMemo('${m.id}')">Registrar</button></div>
    <div class="timeline" style="margin-top:16px">${[...m.memos].reverse().map(x=>`<div class="timeline-item"><div class="date">${esc(x.date)}</div><div>${esc(x.text)}</div></div>`).join('')||'<div class="muted">Sem registros.</div>'}</div></div>
    <div class="panel"><h3>Arquivos do marco</h3><input type="file" id="file-${m.id}"><input class="input" id="filenote-${m.id}" style="margin-top:8px" placeholder="Descrição opcional"><div class="right" style="margin-top:8px"><button class="btn secondary" onclick="addMilestoneFile('${m.id}')">Adicionar referência</button></div>
    <div style="margin-top:12px">${m.files.map(f=>fileRow(f)).join('')||'<div class="muted">Sem arquivos.</div>'}</div></div>
   </div>

  </div>
 </div>`;

function findMilestone(id){for(const p of db.projects){const m=p.milestones.find(x=>x.id===id);if(m)return [p,m]} return [null,null]}
function meetingUpdateMilestone(id,k,v){
 const [p,m]=findMilestone(id); if(!m)return;
 m[k]=v;
 if(k==='status'&&v==='Concluído'&&!m.concludedAt)m.concludedAt=nowBR();
 save();
}
window.meetingUpdateMilestone=meetingUpdateMilestone;
function toggleMilestone(id){document.getElementById('detail-'+id)?.classList.toggle('hidden')} window.toggleMilestone=toggleMilestone;
function updateMilestone(id,k,v){const [p,m]=findMilestone(id);if(!m)return;m[k]=v;if(k==='status'&&v==='Concluído'&&!m.concludedAt)m.concludedAt=nowBR();save();renderProject();} window.updateMilestone=updateMilestone;
function addMilestoneMemo(id){const [p,m]=findMilestone(id);const t=document.getElementById('memo-'+id).value.trim();if(!t)return;m.memos.push({date:nowBR(),text:t});p.lastUpdate=nowBR();save();renderProject();currentTab='milestones';} window.addMilestoneMemo=addMilestoneMemo;
async function uploadServerFile(file, projectId, milestoneId, note){
 const fd=new FormData(); fd.append('file',file); fd.append('project_id',projectId); if(milestoneId)fd.append('milestone_id',milestoneId); fd.append('note',note||''); fd.append('csrf_token',CSRF);
 const res=await fetch('/api/attachments',{method:'POST',headers:{'X-CSRF-Token':CSRF},body:fd});
 if(!res.ok){ const data=await res.json().catch(()=>({})); throw new Error(data.error==='too_large'?'Arquivo acima de 12 MB.':'Falha no upload.'); }
 return await res.json();
}
async function addMilestoneFile(id){
 const [p,m]=findMilestone(id), inp=document.getElementById('file-'+id), note=document.getElementById('filenote-'+id).value.trim();
 if(!inp.files[0])return alert('Selecione um arquivo.');
 try{ const meta=await uploadServerFile(inp.files[0],p.id,m.id,note); m.files.push(meta); p.lastUpdate=nowBR(); save(); renderProject(); }
 catch(e){alert(e.message||'Não foi possível armazenar o arquivo.');}
}
window.addMilestoneFile=addMilestoneFile;
function concludeMilestone(id){const [p,m]=findMilestone(id),t=document.getElementById('conclusion-'+id).value.trim();if(!t)return alert('Registre uma conclusão.');m.conclusion=t;m.status='Concluído';m.concludedAt=nowBR();p.lastUpdate=nowBR();if(p.milestones.every(x=>x.status==='Concluído'))p.status='Concluído';else if(p.status==='Não iniciado')p.status='Em andamento';save();renderProject();currentTab='milestones';} window.concludeMilestone=concludeMilestone;
function fileRow(f){
 const dl=f.url?`<a class="btn ghost" href="${esc(f.url)}">Baixar</a>`:`<span class="badge">arquivo</span>`;
 return `<div class="file-row"><div><b>${esc(f.name)}</b><div class="small">${esc(f.note||'')}${f.date?' • '+esc(f.date):''}</div></div><div style="display:flex;gap:8px;align-items:center"><span class="badge">${f.size?Math.round(f.size/1024)+' KB':'arquivo'}</span>${dl}</div></div>`
}

function addGeneralMemo(){const p=project(currentProjectId),t=document.getElementById('generalMemo').value.trim();if(!t)return;p.generalMemos.push({date:nowBR(),text:t});p.lastUpdate=nowBR();save();renderProject();} window.addGeneralMemo=addGeneralMemo;
async function addProjectFile(){
 const p=project(currentProjectId),inp=document.getElementById('projectFile'),note=document.getElementById('projectFileNote').value.trim();
 if(!inp.files[0])return alert('Selecione um arquivo.');
 try{ const meta=await uploadServerFile(inp.files[0],p.id,null,note); p.files.push(meta); save(); renderProject(); }
 catch(e){alert(e.message||'Não foi possível armazenar o arquivo.');}
}

function addDependency(){
 const p=project(currentProjectId),person=document.getElementById('depPerson').value.trim(),need=document.getElementById('depNeed').value.trim(),deadline=document.getElementById('depDeadline').value;
 if(!person||!need)return alert('Preencha quem foi acionado e o que precisa.');
 db.dependencies.push({id:'d'+Date.now(),projectId:p.id,requester:p.owner,person,need,deadline,status:'Aberta',createdAt:nowBR()});
 save();renderProject();
} window.addDependency=addDependency;
function dependencyRow(d){return `<div class="file-row"><div><b>${esc(d.person)}</b> — ${esc(d.need)}<div class="small">Solicitante: ${esc(d.requester)} • Prazo: ${fmtDate(d.deadline)}</div></div><select class="select" style="width:140px" onchange="setDepStatus('${d.id}',this.value)">${['Aberta','Aguardando','Resolvida'].map(s=>`<option ${d.status===s?'selected':''}>${s}</option>`).join('')}</select></div>`}
function setDepStatus(id,v){const d=db.dependencies.find(x=>x.id===id);d.status=v;save(); if(currentProjectId) renderProject(); else renderDependencies()} window.setDepStatus=setDepStatus;

function startMeeting(id){
 const p=project(id);
 meeting={projectId:id,step:0,draft:{
   previous:clone(p.weeklyCommitments||[]),
   results:{},
   discussion:'',
   decisions:'',
   analysis:'',
   nextCommitments:['','','']
 }};
 renderMeeting();
}
window.startMeeting=startMeeting;

 ];
}

   </div>

   <div class="meeting-stepper" style="grid-template-columns:repeat(4,minmax(0,1fr))">
     ${steps.map((name,i)=>`<div class="meeting-step-pill ${i===meeting.step?'active':i<meeting.step?'done':''}">
       <b>${i+1}</b><br>${esc(name)}
     </div>`).join('')}
   </div>

   <div id="meetingBody" class="meeting-stage"></div>

   <div class="meeting-controls">
     <button class="btn secondary" onclick="meetingPrev()" ${meeting.step===0?'disabled':''}>← Anterior</button>
     <div class="small">Etapa ${meeting.step+1} de 4</div>
     <button class="btn meeting-big-btn" onclick="meetingNext()">${meeting.step===3?'Encerrar e congelar ciclo':'Continuar →'}</button>
   </div>
 </div>`;
 renderMeetingStep();
}

function renderMeetingStep(){
 const p=project(meeting.projectId), d=meeting.draft, body=document.getElementById('meetingBody');

 if(meeting.step===0){
   const done=p.milestones.filter(m=>m.status==='Concluído').length;
   const prog=p.milestones.filter(m=>m.status==='Em andamento').length;
   const risk=p.milestones.filter(m=>m.status==='Em risco').length;
   const openDeps=db.dependencies.filter(x=>x.projectId===p.id&&x.status!=='Resolvida').length;

   const records=[];
   p.generalMemos.forEach(x=>records.push({...x,source:'Projeto'}));
   p.milestones.forEach(m=>m.memos.forEach(x=>records.push({...x,source:m.name})));
   const recent=records.slice().reverse().slice(0,5);

   body.innerHTML=`
     <div class="small">1 • LEITURA EXECUTIVA</div>
     <h2>Resumo do projeto</h2>
     <div class="meeting-note">Esta primeira tela é apenas informativa: ela coloca todos na mesma página antes da discussão começar.</div>

     <div class="panel" style="margin-top:16px">
       <div class="small">OBJETIVO</div>
       <div style="font-size:18px;line-height:1.55;margin-top:6px">${esc(p.objective)}</div>
     </div>

     <div class="meeting-status-grid">
       <div class="meeting-status-card"><div class="small">SITUAÇÃO</div><div class="n" style="font-size:18px">${esc(p.status)}</div></div>
       <div class="meeting-status-card"><div class="small">MARCOS CONCLUÍDOS</div><div class="n">${done} / ${p.milestones.length}</div></div>
       <div class="meeting-status-card"><div class="small">EM ANDAMENTO / RISCO</div><div class="n">${prog} / ${risk}</div></div>
       <div class="meeting-status-card"><div class="small">PENDÊNCIAS EXTERNAS</div><div class="n">${openDeps}</div></div>
     </div>

     <div class="panel">
       <div class="project-head">
         <div><h3>Roadmap dos marcos</h3><div class="small">Visão do estágio atual da transformação.</div></div>
         <span class="badge">${p.milestones.length} marcos</span>
       </div>
       <div style="margin-top:8px">
         ${p.milestones.map((m,i)=>`<div class="meeting-mark-row">
           <div class="roadmap-index">${i+1}</div>
           <div>
             <b>${esc(m.name)}</b>
             <div class="small">${m.memos.length} registro(s) • ${m.files.length} arquivo(s)${m.conclusion?' • conclusão registrada':''}</div>
           </div>
           <div class="small">Deadline: ${fmtDate(m.deadline)}</div>
           <span class="badge"><span class="status-dot ${statusClass(m.status)}"></span>${esc(m.status)}</span>
         </div>`).join('')}
       </div>
     </div>

     <div class="panel">
       <div class="project-head"><div><h3>Evoluções recentes</h3><div class="small">Últimos memorandos do projeto e dos marcos.</div></div><span class="badge">${records.length} registro(s)</span></div>
       <div class="recent-list" style="margin-top:8px">
         ${recent.map(r=>`<div class="item"><div class="small">${esc(r.date)} • ${esc(r.source)}</div><div style="margin-top:4px">${esc(r.text)}</div></div>`).join('')||'<div class="muted">Nenhum registro ainda.</div>'}
       </div>
     </div>`;
 }

 if(meeting.step===1){
   const openDeps=db.dependencies.filter(x=>x.projectId===p.id&&x.status!=='Resolvida');
   body.innerHTML=`
     <div class="small">2 • PRESTAÇÃO DE CONTAS</div>
     <h2>Pendências e compromissos da semana anterior</h2>
     <div class="meeting-note">Aqui a reunião olha para trás: o que estava combinado e o que ainda dependia de outras pessoas.</div>

     <div class="meeting-two" style="margin-top:16px">
       <div class="panel" style="margin:0">
         <div class="project-head"><div><h3>Compromissos assumidos</h3><div class="small">O que ficou congelado na reunião anterior.</div></div><span class="badge">${d.previous.length}</span></div>
         <div style="margin-top:12px">
           ${d.previous.map((c,i)=>{
             const r=d.results[i]||{};
             return `<div class="meeting-commitment-card">
               <div class="meeting-commitment-title">${i+1}. ${esc(c)}</div>
               <div>
                 <label class="small">RESULTADO</label>
                 <select class="select" onchange="meetingSetResult(${i},'status',this.value)">
                   <option value="">Selecione...</option>
                   ${['Realizado','Parcial','Não realizado'].map(x=>`<option ${r.status===x?'selected':''}>${x}</option>`).join('')}
                 </select>
               </div>
               <div style="margin-top:9px">
                 <label class="small">O QUE ACONTECEU?</label>
                 <textarea class="textarea" style="min-height:78px" placeholder="Comentário curto..." oninput="meetingSetResult(${i},'comment',this.value)">${esc(r.comment||'')}</textarea>
               </div>
             </div>`;
           }).join('') || '<div class="muted">Esta é a primeira reunião: ainda não existem compromissos da semana anterior.</div>'}
         </div>
       </div>

       <div class="panel" style="margin:0">
         <div class="project-head"><div><h3>Pendências trazidas para a reunião</h3><div class="small">Dependências externas ainda abertas.</div></div><span class="badge">${openDeps.length}</span></div>
         <div style="margin-top:12px">
           ${openDeps.map(d=>dependencyRow(d)).join('')||'<div class="muted">Nenhuma pendência externa em aberto.</div>'}
         </div>
       </div>
     </div>`;
 }

 if(meeting.step===2){
   body.innerHTML=`
     <div class="small">3 • REUNIÃO EM ANDAMENTO</div>
     <h2>O que está sendo discutido e decidido</h2>
     <div class="meeting-note">Esta é a tela que fica aberta durante a conversa. O registro acontece na hora.</div>

     <div class="meeting-two" style="margin-top:16px">
       <div>
         <div class="panel" style="margin:0">
           <label class="small">REGISTRO DA REUNIÃO</label>
           <textarea class="textarea" style="min-height:260px" placeholder="Discussões, explicações, orientações, dificuldades e avanços relatados..." oninput="meeting.draft.discussion=this.value">${esc(d.discussion)}</textarea>
         </div>

         <div class="panel">
           <label class="small">ANÁLISE GERAL DO DONO / DIREÇÃO</label>
           <textarea class="textarea" style="min-height:130px" placeholder="Leitura geral do estágio do projeto após a discussão..." oninput="meeting.draft.analysis=this.value">${esc(d.analysis)}</textarea>
         </div>
       </div>

       <div>
         <div class="panel" style="margin:0">
           <label class="small">DECISÕES TOMADAS</label>
           <textarea class="textarea" style="min-height:260px" placeholder="O que ficou efetivamente decidido nesta reunião..." oninput="meeting.draft.decisions=this.value">${esc(d.decisions)}</textarea>
         </div>

         <div class="panel">
           <h3>Registrar evolução em um marco</h3>
           <select id="meetingMemoTarget" class="select">
             <option value="general">Projeto — registro geral</option>
             ${p.milestones.map(m=>`<option value="${m.id}">Marco — ${esc(m.name)}</option>`).join('')}
           </select>
           <textarea id="meetingMemoText" class="textarea" style="min-height:95px;margin-top:9px" placeholder="Memorando que surgiu na reunião..."></textarea>
           <div class="right" style="margin-top:8px"><button class="btn secondary" onclick="meetingAddMemo()">Registrar memorando</button></div>
         </div>
       </div>
     </div>`;
 }

 if(meeting.step===3){
   body.innerHTML=`
     <div class="small">4 • PRÓXIMA SEMANA</div>
     <h2>O que fica para ser resolvido</h2>
     <div class="meeting-note">A reunião termina deixando explícitos os compromissos do dono e as novas dependências externas.</div>

     <div class="meeting-two" style="margin-top:16px">
       <div class="panel" style="margin:0">
         <div class="project-head"><div><h3>Compromissos até a próxima reunião</h3><div class="small">Resultados esperados — não microtarefas.</div></div></div>
         ${[0,1,2].map(i=>`<div class="meeting-commitment-card">
           <div class="small">COMPROMISSO ${i+1}</div>
           <textarea class="textarea" style="min-height:82px;margin-top:7px" placeholder="O que precisa estar diferente na próxima semana?" oninput="meeting.draft.nextCommitments[${i}]=this.value">${esc(d.nextCommitments[i]||'')}</textarea>
         </div>`).join('')}
       </div>

       <div class="panel" style="margin:0">
         <div class="project-head"><div><h3>Novas pendências externas</h3><div class="small">Quando o dono precisa acionar outra pessoa.</div></div></div>

         <div style="margin-top:12px">
           <label class="small">ACIONADO</label>
           <input id="meetingDepPerson" class="input" placeholder="Quem precisa agir">

           <label class="small" style="display:block;margin-top:10px">O QUE PRECISA SER RESOLVIDO</label>
           <textarea id="meetingDepNeed" class="textarea" style="min-height:110px" placeholder="Qual dependência precisa ser resolvida?"></textarea>

           <label class="small" style="display:block;margin-top:10px">PRAZO</label>
           <input id="meetingDepDeadline" class="input" type="date">

           <div class="right" style="margin-top:10px">
             <button class="btn secondary" onclick="meetingAddDependency()">Adicionar pendência</button>
           </div>
         </div>

         <div class="hr"></div>
         <div class="small">PENDÊNCIAS QUE FICARÃO ABERTAS</div>
         <div style="margin-top:9px">
           ${db.dependencies.filter(x=>x.projectId===p.id&&x.status!=='Resolvida').map(d=>`<div class="file-row"><div><b>${esc(d.person)}</b><div class="small">${esc(d.need)} • ${fmtDate(d.deadline)}</div></div><span class="badge">${esc(d.status)}</span></div>`).join('')||'<div class="muted">Nenhuma pendência externa.</div>'}
         </div>
       </div>
     </div>

     <div class="meeting-summary" style="margin-top:16px">
       <div class="small">AO ENCERRAR A REUNIÃO</div>
       <div style="margin-top:5px;font-weight:750">O ciclo fica congelado no histórico. Os compromissos e pendências acima serão a base da próxima reunião.</div>
     </div>`;
 }
}

function meetingSetResult(i,k,v){
 if(!meeting.draft.results[i])meeting.draft.results[i]={};
 meeting.draft.results[i][k]=v;
}
window.meetingSetResult=meetingSetResult;

function meetingAddMemo(){
 const p=project(meeting.projectId);
 const target=document.getElementById('meetingMemoTarget').value;
 const text=document.getElementById('meetingMemoText').value.trim();
 if(!text)return alert('Escreva o memorando.');
 const item={date:nowBR(),text};
 if(target==='general')p.generalMemos.push(item);
 else {
   const [pp,m]=findMilestone(target);
   if(m)m.memos.push(item);
 }
 p.lastUpdate=nowBR();
 save();
 document.getElementById('meetingMemoText').value='';
 alert('Memorando registrado.');
}
window.meetingAddMemo=meetingAddMemo;

function meetingAddDependency(){
 const p=project(meeting.projectId);
 const person=document.getElementById('meetingDepPerson').value.trim();
 const need=document.getElementById('meetingDepNeed').value.trim();
 const deadline=document.getElementById('meetingDepDeadline').value;
 if(!person||!need)return alert('Preencha quem foi acionado e o que precisa.');
 db.dependencies.push({
   id:'d'+Date.now(),
   projectId:p.id,
   requester:p.owner,
   person,
   need,
   deadline,
   status:'Aberta',
   createdAt:nowBR()
 });
 save();
 renderMeeting();
}
window.meetingAddDependency=meetingAddDependency;

function meetingPrev(){
 if(meeting.step>0){
   meeting.step--;
   renderMeeting();
 }
}
window.meetingPrev=meetingPrev;

function meetingNext(){
 if(meeting.step<3){
   meeting.step++;
   renderMeeting();
   return;
 }

 const d=meeting.draft;

 if(d.previous.length){
   const missing=d.previous.some((_,i)=>!d.results[i]||!d.results[i].status);
   if(missing)return alert('Antes de fechar, classifique todos os compromissos da semana anterior.');
 }

 const next=d.nextCommitments.map(x=>x.trim()).filter(Boolean);
 if(!next.length)return alert('Defina pelo menos um compromisso para a próxima reunião.');

 closeMeeting();
}
window.meetingNext=meetingNext;

function closeMeeting(){
 const p=project(meeting.projectId), d=meeting.draft;
 const next=d.nextCommitments.map(x=>x.trim()).filter(Boolean);

 const rec={
   id:'mtg'+Date.now(),
   projectId:p.id,
   projectName:p.name,
   owner:p.owner,
   type:p.weeklyCommitments&&p.weeklyCommitments.length?'semanal':'inaugural',
   closedAt:nowBR(),
   previous:d.previous,
   results:d.results,
   analysis:d.analysis,
   discussion:d.discussion,
   decisions:d.decisions,
   nextCommitments:next,
   openDependencies:clone(db.dependencies.filter(x=>x.projectId===p.id&&x.status!=='Resolvida'))
 };

 db.meetings.push(rec);
 p.weeklyCommitments=next;
 p.validated=true;
 p.lastUpdate=rec.closedAt;
 if(p.status==='Não iniciado')p.status='Em andamento';

 save();
 renderMeetingClosed(p,rec);
}

function renderMeetingClosed(p,rec){
 const idx=db.projects.findIndex(x=>x.id===p.id);
 const next=idx>=0 && idx<db.projects.length-1 ? db.projects[idx+1] : null;

 document.getElementById('app').innerHTML=`
   <div class="meeting-closed">
     <div class="check">✓</div>
     <div class="small">CICLO CONGELADO NO HISTÓRICO</div>
     <h1 style="font-size:34px;margin-top:7px">${esc(p.name)} — reunião encerrada</h1>
     <div class="muted">Fechada em ${esc(rec.closedAt)}</div>

     <div class="panel" style="text-align:left;margin-top:22px">
       <h3>Compromissos para a próxima reunião</h3>
       ${rec.nextCommitments.map((c,i)=>`<div class="file-row"><div><b>${i+1}.</b> ${esc(c)}</div></div>`).join('')}

       <div class="hr"></div>
       <h3>Pendências externas em aberto</h3>
       ${(rec.openDependencies||[]).map(d=>`<div class="file-row"><div><b>${esc(d.person)}</b><div class="small">${esc(d.need)} • ${fmtDate(d.deadline)}</div></div><span class="badge">${esc(d.status)}</span></div>`).join('')||'<div class="muted">Nenhuma pendência externa.</div>'}

       ${rec.decisions?`<div class="hr"></div><div class="small">DECISÕES REGISTRADAS</div><div style="margin-top:6px">${esc(rec.decisions)}</div>`:''}
     </div>

     <div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px">
       <button class="btn secondary" onclick="openProject('${p.id}')">Voltar ao projeto</button>
       <button class="btn secondary" onclick="renderDashboard()">Visão Geral</button>
       ${next?`<button class="btn" onclick="startMeeting('${next.id}')">Próximo projeto: ${esc(next.name)} →</button>`:''}
     </div>
   </div>`;
}


document.querySelectorAll('.nav button[data-view]').forEach(b=>b.addEventListener('click',()=>{ if(b.dataset.view==='dashboard')renderDashboard(); if(b.dataset.view==='dependencies')renderDependencies(); if(b.dataset.view==='history')renderHistory(); }));
document.getElementById('exportBackup').addEventListener('click', exportBackup);
renderDashboard();
</script>
</body>
</html>
