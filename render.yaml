services:
  - type: web
    name: central-gestao-app-v31
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python reset_viewer_passwords.py && gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: central-gestao-db-v31
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DAILY_IMPORT_TOKEN
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: MEETING_TRANSCRIBE_MODEL
        value: gpt-transcribe
      - key: MEETING_SUMMARY_MODEL
        value: gpt-5.6-luna

databases:
  - name: central-gestao-db-v31
    plan: 0.1c-256mb
